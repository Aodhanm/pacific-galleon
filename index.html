<meta charset="utf-8">
<title>Pacific Galleon</title>
<style>
  :root{ --display: Trattatello, Luminari, "Academy Engraved LET", serif; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#7ec4e4;overflow:hidden;font-family:var(--display);
    -webkit-font-smoothing:antialiased}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .plate{position:absolute;inset:0;pointer-events:none;display:flex;
    flex-direction:column;align-items:center}
  h1{font-size:clamp(44px,7.5vw,110px);margin:7vh 0 0;font-weight:400;color:#1d3a4e;
    letter-spacing:.04em;text-shadow:0 2px 0 rgba(255,255,255,.35), 0 6px 18px rgba(20,50,70,.25)}
  .sub{font-size:clamp(13px,1.4vw,19px);color:#2c4d61;letter-spacing:.14em;margin-top:.6em;
    text-shadow:0 1px 2px rgba(255,255,255,.5)}
  .menu{position:absolute;bottom:7vh;text-align:center}
  .go{font-size:clamp(15px,1.6vw,22px);color:#8a4a0e;letter-spacing:.1em;
    text-shadow:0 1px 2px rgba(255,255,255,.55);animation:pulse 2.2s ease-in-out infinite}
  .caps{font-size:clamp(11px,1vw,14px);color:#2c4d61;letter-spacing:.1em;margin-top:.9em;
    text-shadow:0 1px 2px rgba(255,255,255,.5)}
  .caps b{color:#143040;font-weight:400}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>

<canvas id="scene"></canvas>
<div class="plate">
  <h1>Pacific Galleon</h1>
  <div class="sub">THE MANILA SHIP, OFF CABO SAN LUCAS &middot; 1579 &ndash; 1743</div>
  <div class="menu">
    <div class="go">Enter &mdash; lie in wait</div>
    <div class="caps"><b>1</b> Drake &middot; <b>2</b> Cavendish &middot; <b>3</b> Rogers &middot; <b>4</b> Anson</div>
  </div>
</div>
<audio id="shot" src="cannon-one.m4a" preload="auto"></audio>

<script>
// =====================================================================
// The title: an action off the cape, in profile, by day. One English
// private ship with St George's cross at her mastheads trading
// broadsides with a Spanish galleon under the Cross of Burgundy, the
// arch of Cabo San Lucas behind them. Everything drawn in the page.
// =====================================================================
const cv = document.getElementById("scene");
const ctx = cv.getContext("2d", { alpha:false });
let W=0, H=0;
function resize(){
  const d = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d;
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize", resize); resize();

// one cannon report per broadside: a small pool of the Victory single
// shot, started muted until the first gesture so autoplay is happy
const shotPool = Array.from({length: 3}, () => {
  const a = new Audio("cannon-one.m4a"); a.volume = .55; return a;
});
let shotI = 0, audioOn = false;
const gullSnd = ["gull1.m4a","gull2.m4a"].map(f => { const a = new Audio(f); a.volume = .3; return a; });
const splashSnd = Array.from({length: 2}, () => { const a = new Audio("splash.m4a"); a.volume = .4; return a; });
let splashI = 0;
function splashSound(){
  if (!audioOn) return;
  const a = splashSnd[splashI = (splashI+1) % splashSnd.length];
  try { a.currentTime = 0; a.volume = .28 + Math.random()*.14; a.play().catch(()=>{}); } catch(e){}
}
let gullWait = 6 + Math.random()*8;
function gullCry(){
  if (!audioOn) return;
  const a = gullSnd[(Math.random()*gullSnd.length)|0];
  try { a.currentTime = 0; a.volume = .18 + Math.random()*.16; a.play().catch(()=>{}); } catch(e){}
}
function gullStep(dt){
  gullWait -= dt;
  if (gullWait <= 0){ gullCry(); gullWait = 9 + Math.random()*14; }   // now and then, no more
}
function shoot(){
  if (!audioOn) return;
  const a = shotPool[shotI = (shotI+1) % shotPool.length];
  try { a.currentTime = 0; a.play().catch(()=>{}); } catch(e){}
}

const HORIZON = () => H * .52;

// ----------------------------------------------------------- the sky
function drawSky(t){
  const hz = HORIZON();
  const g = ctx.createLinearGradient(0, 0, 0, hz);
  g.addColorStop(0, "#5fb5e2");
  g.addColorStop(.62, "#9fd4ea");
  g.addColorStop(1, "#f2e3bc");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, hz);

  // the sun, high to the south-west, with its glare
  const sx = W * .22, sy = H * .16;
  const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, H*.3);
  halo.addColorStop(0, "rgba(255,250,225,.95)");
  halo.addColorStop(.18, "rgba(255,244,200,.55)");
  halo.addColorStop(1, "rgba(255,244,200,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(sx-H*.3, sy-H*.3, H*.6, H*.6);
  ctx.fillStyle = "#fffbe8";
  ctx.beginPath(); ctx.arc(sx, sy, H*.035, 0, Math.PI*2); ctx.fill();

  // flat fair-weather clouds, drifting
  ctx.fillStyle = "rgba(255,255,255,.85)";
  const clouds = [
    [.55, .14, .16, 1], [.78, .10, .11, .8], [.38, .24, .10, .7],
    [.9, .3, .13, .75], [.12, .34, .09, .6], [.65, .3, .08, .55],
  ];
  for (const [fx, fy, fw, al] of clouds){
    const x = ((fx + t*.0022) % 1.2 - .1) * W, y = fy*H, w = fw*W;
    ctx.globalAlpha = al * .8;
    ctx.beginPath();
    ctx.ellipse(x, y, w, w*.16, 0, 0, Math.PI*2);
    ctx.ellipse(x - w*.4, y + w*.05, w*.5, w*.11, 0, 0, Math.PI*2);
    ctx.ellipse(x + w*.45, y + w*.04, w*.55, w*.12, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // the odd bird passing: two gulls crossing on a long slow cycle, so
  // the sky is alive but not busy
  ctx.strokeStyle = "rgba(40,54,66,.5)";
  ctx.lineWidth = Math.max(1, H*.0017);
  for (let i = 0; i < 2; i++){
    const cycle = (t*.02 + i*.5) % 1;
    if (cycle > .7) continue;                        // mostly empty sky
    const bx = (cycle/.7) * W*1.2 - W*.1;
    const by = H*(.12 + i*.05) + Math.sin(t*.4+i)*H*.006;
    const s = H*.011;
    const flap = Math.sin(t*3.5 + i*2) * .45;
    ctx.beginPath();
    ctx.moveTo(bx - s, by + s*flap);
    ctx.quadraticCurveTo(bx - s*.3, by - s*.5, bx, by);
    ctx.quadraticCurveTo(bx + s*.3, by - s*.5, bx + s, by + s*flap);
    ctx.stroke();
  }
}

// ------------------------------------------- the cape and the arch
function drawCape(t){
  const hz = HORIZON();
  // far mainland, hazy
  ctx.fillStyle = "#c9b393";
  ctx.globalAlpha = .5;
  ctx.beginPath();
  ctx.moveTo(W*.55, hz);
  ctx.lineTo(W*.62, hz - H*.035);
  ctx.lineTo(W*.72, hz - H*.05);
  ctx.lineTo(W*.84, hz - H*.03);
  ctx.lineTo(W*.9, hz - H*.045);
  ctx.lineTo(W*1.02, hz - H*.02);
  ctx.lineTo(W*1.02, hz);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  // Land's End: the granite ridge coming down into the sea, right of frame
  const bx = W * .86;
  ctx.fillStyle = "#b29877";
  ctx.beginPath();
  ctx.moveTo(W*1.02, hz);
  ctx.lineTo(W*1.02, hz - H*.16);
  ctx.lineTo(bx + W*.1, hz - H*.14);
  ctx.lineTo(bx + W*.055, hz - H*.075);
  ctx.lineTo(bx + W*.028, hz - H*.085);
  ctx.lineTo(bx + W*.012, hz - H*.045);
  ctx.lineTo(bx, hz);
  ctx.closePath(); ctx.fill();
  // lit faces
  ctx.fillStyle = "#cdb38d";
  ctx.beginPath();
  ctx.moveTo(bx + W*.028, hz - H*.085);
  ctx.lineTo(bx + W*.055, hz - H*.075);
  ctx.lineTo(bx + W*.045, hz);
  ctx.lineTo(bx + W*.012, hz);
  ctx.closePath(); ctx.fill();

  // THE ARCH, standing free off the point
  const ax = bx - W*.045, aw = W*.034, ah = H*.085;
  ctx.fillStyle = "#b29877";
  ctx.beginPath();
  ctx.moveTo(ax - aw*.5, hz);
  ctx.bezierCurveTo(ax - aw*.52, hz - ah*.9, ax - aw*.15, hz - ah, ax, hz - ah*.92);
  ctx.bezierCurveTo(ax + aw*.3, hz - ah*.85, ax + aw*.52, hz - ah*.5, ax + aw*.55, hz);
  ctx.closePath(); ctx.fill();
  // the window through it
  ctx.fillStyle = "#8fd2e2";
  ctx.beginPath();
  ctx.moveTo(ax - aw*.13, hz);
  ctx.bezierCurveTo(ax - aw*.15, hz - ah*.5, ax + aw*.1, hz - ah*.52, ax + aw*.17, hz - ah*.3);
  ctx.bezierCurveTo(ax + aw*.2, hz - ah*.15, ax + aw*.22, hz, ax + aw*.2, hz);
  ctx.closePath(); ctx.fill();
  // a sunlit edge on the arch
  ctx.strokeStyle = "rgba(240,224,190,.8)";
  ctx.lineWidth = Math.max(1, H*.004);
  ctx.beginPath();
  ctx.moveTo(ax - aw*.45, hz - ah*.35);
  ctx.bezierCurveTo(ax - aw*.4, hz - ah*.8, ax - aw*.1, hz - ah*.94, ax + aw*.05, hz - ah*.88);
  ctx.stroke();
  // the outer friar rock
  ctx.fillStyle = "#a8906f";
  ctx.beginPath();
  ctx.moveTo(ax - aw*1.5, hz);
  ctx.lineTo(ax - aw*1.25, hz - ah*.42);
  ctx.lineTo(ax - aw*.95, hz);
  ctx.closePath(); ctx.fill();
}

// ------------------------------------------------------------ the sea
function drawSea(t){
  const hz = HORIZON();
  const g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, "#49b4cf");
  g.addColorStop(.3, "#2f9ac4");
  g.addColorStop(1, "#176b9e");
  ctx.fillStyle = g;
  ctx.fillRect(0, hz, W, H - hz);

  // the sun's glitter lane
  ctx.save();
  const sx = W * .22;
  for (let i = 0; i < 70; i++){
    const f = i / 70;
    const y = hz + f*f * (H - hz) * .9 + 2;
    const spread = 20 + f * W * .1;
    const n = 2 + Math.floor(f*4);
    for (let k = 0; k < n; k++){
      const ph = Math.sin(t*1.6 + i*1.7 + k*2.9);
      if (ph < .1) continue;
      const x = sx + Math.sin(i*12.9898 + k*78.233) * spread;
      ctx.globalAlpha = ph * (.5 - f*.3);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y, Math.max(2, 10*f + ph*4), Math.max(1, 2.4*f));
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // long low swells, rolling through
  ctx.strokeStyle = "rgba(255,255,255,.14)";
  for (let i = 0; i < 14; i++){
    const f = i / 14;
    const y0 = hz + 8 + f*f * (H - hz) * .96;
    ctx.lineWidth = 1 + f * 2.2;
    ctx.beginPath();
    for (let x = -20; x <= W+20; x += 24){
      const y = y0 + Math.sin(x*.008 + t*(.6+f) + i*2) * (1.5 + f*5);
      x === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

// ------------------------------------------------------- a ship, side on
// Parametric profile painter, drawn for the WOODES ROGERS era, 1709:
// kind "english" is a Bristol privateer like his Duke, a low flush-
// decked frigate; "galleon" is the Manila ship, high-charged aft. Flags
// are correct for the year: the English wear the RED ENSIGN (the 1707
// first-union canton on a red field) aft and the UNION JACK at the bow;
// the Spaniard wears the CROSS OF BURGUNDY, used at sea until 1785.
// x,y = waterline midpoint; s = hull length px; face = 1 bow right.

// --- flags that actually fly: each flag is painted once to a texture,
// then blitted in vertical columns with a travelling wave, so the cloth
// AND the device on it ripple together instead of the symbol sitting
// flat inside a wobbling outline.
const flagTex = {};
function makeFlagTex(key, paint){
  if (flagTex[key]) return flagTex[key];
  const TW = 128, TH = 80;
  const c = document.createElement("canvas"); c.width = TW; c.height = TH;
  const g = c.getContext("2d");
  paint(g, TW, TH);
  flagTex[key] = c; return c;
}
// the 1606/1707 first union: blue field, white saltire, red cross, into g
function paintUnion(g, x, y, w, h){
  g.fillStyle = "#1c2a6b"; g.fillRect(x, y, w, h);
  g.strokeStyle = "#f4f4f4"; g.lineWidth = h*.2;
  g.beginPath();
  g.moveTo(x, y); g.lineTo(x+w, y+h); g.moveTo(x, y+h); g.lineTo(x+w, y); g.stroke();
  g.strokeStyle = "#c62828"; g.lineWidth = h*.24;
  g.beginPath();
  g.moveTo(x+w/2, y); g.lineTo(x+w/2, y+h);
  g.moveTo(x, y+h/2); g.lineTo(x+w, y+h/2); g.stroke();
}
function texRedEnsign(){ return makeFlagTex("red", (g,W,H) => {
  g.fillStyle = "#b11f1f"; g.fillRect(0,0,W,H);
  paintUnion(g, 0, 0, W*.5, H*.5);                 // canton at the hoist-top
}); }
function texUnionJack(){ return makeFlagTex("jack", (g,W,H) => paintUnion(g,0,0,W,H)); }
function texBurgundy(){ return makeFlagTex("burg", (g,W,H) => {
  g.fillStyle = "#f3ecda"; g.fillRect(0,0,W,H);
  g.strokeStyle = "#b3362a"; g.lineWidth = H*.14; g.lineCap = "round";
  // a ragged saltire: two slightly jagged diagonals
  for (const [sx,sy,ex,ey] of [[0,0,W,H],[0,H,W,0]]){
    g.beginPath(); g.moveTo(sx,sy);
    g.lineTo((sx+ex)/2 + (sy<ey?6:-6), (sy+ey)/2); g.lineTo(ex,ey); g.stroke();
  }
}); }
// blit a flag texture flying from the staff at (x,y) toward -x (leeward),
// rippling. w,h = flag size; t drives the wave.
function flyFlag(tex, x, y, w, h, t, seed, dir){
  dir = dir || -1;                                   // -1 aft, +1 forward
  const N = 20, TW = tex.width, TH = tex.height;
  for (let i = 0; i < N; i++){
    const f0 = i/N, f1 = (i+1)/N;
    const amp = f0 * h*.22;                          // the free end moves most
    const wv = Math.sin(f0*7 - t*6 + seed);
    const dy = y + wv*amp;
    const sq = 1 + .12*Math.cos(f0*7 - t*6 + seed);  // columns squash a little
    const left = dir < 0 ? x - f1*w : x + f0*w;
    ctx.save();
    ctx.globalAlpha = .9 - .25*Math.max(0,-wv);      // troughs sit in shadow
    ctx.drawImage(tex, f0*TW, 0, (f1-f0)*TW, TH,
                  left, dy - h/2*sq, w/N + .5, h*sq);
    ctx.restore();
  }
}
function pennant(x, y, len, col, t, seed){
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.2, len*.06);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x - len*.5, y + Math.sin(t*4+seed)*len*.08,
                       x - len, y + len*.03 + Math.sin(t*4+seed+1)*len*.12);
  ctx.stroke();
}

function drawProfileShip(kind, x, y, s, face, t, ph){
  const gal = kind === "galleon";
  const bob = Math.sin(t*.9 + ph) * s*.01;
  const roll = Math.sin(t*.7 + ph*2) * .012;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(face, 1);
  ctx.rotate(roll);

  const L = s;
  const free = s * (gal ? .085 : .07);        // freeboard at midships
  const deck = -free;                          // main deck line, midships
  const sBow = deck - s*(gal ? .05 : .035);    // sheer rises toward the bow
  const sStern = deck - s*(gal ? .085 : .05);  // and more toward the stern
  const keel = s*(gal ? .072 : .06);           // depth of keel below water
  const col = {
    hull: gal ? "#5a3a1e" : "#4a3018", hullLo: gal ? "#3f2814" : "#33210f",
    band: gal ? "#9c5a2a" : "#6f4a22", wale: gal ? "#caa060" : "#a07a44",
    works: gal ? "#8a5228" : "#6b4a24", gild: "#e3b54a",
  };

  // reflection
  ctx.save(); ctx.scale(1,-1); ctx.globalAlpha = .12;
  ctx.fillStyle = col.hullLo; ctx.fillRect(-L*.46, -keel, L*.92, keel*.8);
  ctx.restore();

  // ---- HULL: a long low profile. Raked stem and beakhead forward, a
  //      transom stern aft, the sheer sweeping up at both ends.
  ctx.beginPath();
  ctx.moveTo(L*.52, sBow);                                    // stem head
  ctx.quadraticCurveTo(L*.56, deck+free*.4, L*.48, keel*.35); // forefoot
  ctx.quadraticCurveTo(L*.44, keel, L*.3, keel);              // down to keel
  ctx.lineTo(-L*.34, keel);                                   // the long keel
  ctx.quadraticCurveTo(-L*.46, keel*.95, -L*.47, keel*.2);    // sternpost
  ctx.lineTo(-L*.5, sStern);                                  // up the transom
  ctx.lineTo(-L*.46, sStern);
  // the sheer line, deck edge, sweeping bow to stern
  ctx.quadraticCurveTo(-L*.1, deck+s*.012, L*.2, deck);
  ctx.quadraticCurveTo(L*.42, deck-s*.004, L*.52, sBow);
  ctx.closePath();
  ctx.fillStyle = col.hull; ctx.fill();

  // the underbody, darker below the waterline
  ctx.save();
  ctx.beginPath(); ctx.rect(-L*.5, 0, L, keel+2); ctx.clip();
  ctx.fillStyle = col.hullLo;
  ctx.beginPath();
  ctx.moveTo(L*.5, 0); ctx.quadraticCurveTo(L*.44, keel, L*.3, keel);
  ctx.lineTo(-L*.34, keel); ctx.quadraticCurveTo(-L*.46, keel*.95, -L*.47, keel*.2);
  ctx.lineTo(-L*.47, 0); ctx.closePath(); ctx.fill();
  ctx.restore();

  // the painted gunport strake and the wales running her length
  const strakeY = deck + free*.5;
  ctx.strokeStyle = col.band; ctx.lineWidth = s*(gal?.05:.042); ctx.lineCap = "butt";
  ctx.beginPath();
  ctx.moveTo(-L*.47, strakeY + s*.004);
  ctx.quadraticCurveTo(0, strakeY + s*.02, L*.5, strakeY - s*.002);
  ctx.stroke();
  ctx.strokeStyle = col.wale; ctx.lineWidth = Math.max(1.5, s*.009);
  for (const off of [free*.2, free*.72]){
    ctx.beginPath();
    ctx.moveTo(-L*.47, deck + off);
    ctx.quadraticCurveTo(0, deck + off + s*.016, L*.5, deck + off - s*.006);
    ctx.stroke();
  }

  // ---- gunports: square lids open, red inside, a muzzle run out
  const nP = gal ? 9 : 7;
  for (let i = 0; i < nP; i++){
    const f = -.34 + i*(.68/(nP-1));
    const px = L*f, py = strakeY - s*.006 + f*f*s*.01;
    ctx.fillStyle = "#15100a"; ctx.fillRect(px - s*.013, py, s*.026, s*.022);
    ctx.fillStyle = "#8a1410"; ctx.fillRect(px - s*.013, py - s*.015, s*.026, s*.013);
    ctx.strokeStyle = "rgba(20,12,6,.6)"; ctx.lineWidth = Math.max(.6, s*.0025);
    ctx.strokeRect(px - s*.013, py, s*.026, s*.022);
    ctx.fillStyle = "#0b0908"; ctx.fillRect(px - s*.003, py + s*.006, s*.016, s*.006);
  }

  // ---- upperworks: a raised quarterdeck aft and forecastle forward,
  //      sitting above the sheer, with an open waist between
  ctx.fillStyle = col.works;
  if (gal){
    // the high charged sterncastle, stepped, and a tall beakhead
    ctx.beginPath();
    ctx.moveTo(-L*.5, sStern); ctx.lineTo(-L*.5, sStern - s*.14);
    ctx.lineTo(-L*.3, sStern - s*.1); ctx.lineTo(-L*.28, deck); ctx.closePath(); ctx.fill();
    ctx.fillRect(-L*.5, sStern - s*.14, L*.12, s*.06);        // the poop
    ctx.fillStyle = col.gild; 
    for (const yy of [sStern - s*.01, sStern - s*.06, sStern - s*.11]){
      ctx.fillRect(-L*.5, yy, L*.2, Math.max(1,s*.006));
    }
    ctx.fillStyle = "#f3d27c";                                // stern windows
    for (let r2=0;r2<2;r2++) for (let c2=0;c2<4-r2;c2++)
      ctx.fillRect(-L*.485 + c2*s*.03, sStern - s*.035 - r2*s*.05, s*.016, s*.024);
    ctx.fillStyle = col.gild;                                 // stern lantern
    ctx.beginPath(); ctx.arc(-L*.505, sStern - s*.155, s*.012, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = col.works;
    ctx.fillRect(L*.26, deck - s*.06, L*.16, s*.06);          // forecastle
  } else {
    // a trim privateer: a low quarterdeck and a short forecastle
    ctx.beginPath();
    ctx.moveTo(-L*.47, sStern); ctx.lineTo(-L*.47, sStern - s*.06);
    ctx.lineTo(-L*.24, sStern - s*.05); ctx.lineTo(-L*.22, deck); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#cdbb90";                                // quarter windows
    for (let c2=0;c2<3;c2++) ctx.fillRect(-L*.45 + c2*s*.03, sStern - s*.04, s*.016, s*.02);
    ctx.fillStyle = col.works;
    ctx.fillRect(L*.26, deck - s*.04, L*.14, s*.04);          // forecastle
    // the open waist rail on stanchions
    ctx.strokeStyle = col.works; ctx.lineWidth = Math.max(1, s*.004);
    ctx.beginPath(); ctx.moveTo(-L*.22, deck - s*.025); ctx.lineTo(L*.26, deck - s*.025); ctx.stroke();
    for (let i=0;i<10;i++){ const rx=-L*.2+i*L*.046;
      ctx.beginPath(); ctx.moveTo(rx, deck); ctx.lineTo(rx, deck - s*.025); ctx.stroke(); }
  }

  // ---- beakhead and headrails, raked out under the bowsprit
  ctx.fillStyle = col.works;
  ctx.beginPath();
  ctx.moveTo(L*.5, deck + free*.3);
  ctx.quadraticCurveTo(L*.64, deck + free*.1, L*.66, deck - s*.04);
  ctx.lineTo(L*.5, deck - s*.02); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col.gild;                                   // a gilt figurehead
  ctx.beginPath(); ctx.ellipse(L*.63, deck - s*.01, s*.016, s*.024, -.5, 0, Math.PI*2); ctx.fill();

  // ---- channels with deadeyes outboard, where the shrouds set up
  const mastX = gal ? [-L*.3, L*.02, L*.3] : [-L*.29, L*.03, L*.31];
  const mastH = gal ? [s*.4, s*.56, s*.42] : [s*.4, s*.54, s*.4];
  ctx.strokeStyle = "#2e2110"; ctx.lineWidth = Math.max(1, s*.004);
  for (const cx3 of mastX){
    ctx.beginPath(); ctx.moveTo(cx3 - L*.028, deck + free*.3); ctx.lineTo(cx3 + L*.028, deck + free*.3); ctx.stroke();
    ctx.fillStyle = "#1c140a";
    for (let d2=-2; d2<=2; d2++){ ctx.beginPath(); ctx.arc(cx3+d2*L*.011, deck+free*.33, s*.0035, 0, Math.PI*2); ctx.fill(); }
  }

  // ---- masts and canvas. Square sails are gently bellied TRAPEZOIDS,
  //      taller than wide, not round balloons.
  const windLean = .05;
  for (let m = 0; m < 3; m++){
    const mx = mastX[m], mh = mastH[m], top = deck - mh;
    ctx.strokeStyle = "#241a0c"; ctx.lineWidth = Math.max(2, s*.015);
    ctx.beginPath(); ctx.moveTo(mx, deck + s*.005); ctx.lineTo(mx + mh*windLean*.4, top); ctx.stroke();
    ctx.fillStyle = "#2e2110";                                // a top platform
    ctx.fillRect(mx + mh*windLean*.24 - s*.018, deck - mh*.56, s*.036, s*.009);

    if (m === 0){
      // a lateen mizzen, period for 1709: a tall narrow triangle aft
      ctx.strokeStyle = "#2e2110"; ctx.lineWidth = Math.max(1.2, s*.008);
      ctx.beginPath(); ctx.moveTo(mx - L*.15, deck - mh*.28); ctx.lineTo(mx + L*.08, deck - mh*.98); ctx.stroke();
      ctx.fillStyle = "rgba(244,236,214,.95)";
      ctx.beginPath();
      ctx.moveTo(mx - L*.14, deck - mh*.3);
      ctx.lineTo(mx + L*.065, deck - mh*.94);
      ctx.quadraticCurveTo(mx + L*.01, deck - mh*.38, mx - L*.03, deck - mh*.18);
      ctx.closePath(); ctx.fill();
    } else {
      const baseW = m === 1 ? L*.24 : L*.19;
      const SPANS = m === 1
        ? [[.05, .42, 1], [.46, .74, .86], [.78, .97, .64]]   // course, topsail, t'gallant
        : [[.06, .46, 1], [.5, .9, .78]];
      for (const [fB, fT, wf] of SPANS){
        const yT = deck - mh*fT, yB = deck - mh*fB;
        const hT = baseW*wf*.46, hB = baseW*wf*.5, belly = baseW*wf*.1;
        ctx.strokeStyle = "#2e2110"; ctx.lineWidth = Math.max(1.2, s*.008);
        ctx.beginPath(); ctx.moveTo(mx - hT, yT); ctx.lineTo(mx + hT, yT); ctx.stroke();
        const grad = ctx.createLinearGradient(mx - hB, 0, mx + hB, 0);
        grad.addColorStop(0, "#fbf6ea"); grad.addColorStop(.5, "#eee3c9"); grad.addColorStop(1, "#dccfae");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(mx - hT, yT);
        ctx.quadraticCurveTo(mx - hB - belly, (yT+yB)/2, mx - hB, yB);        // leeward belly
        ctx.quadraticCurveTo(mx, yB + belly*.5, mx + hB, yB);                 // scalloped foot
        ctx.quadraticCurveTo(mx + hB + belly*.3, (yT+yB)/2, mx + hT, yT);
        ctx.closePath(); ctx.fill();
        // bolt-rope edge and a reef band
        ctx.strokeStyle = "rgba(120,100,70,.4)"; ctx.lineWidth = Math.max(.6, s*.003);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mx - hB*.82, yB - (yB-yT)*.34);
        ctx.quadraticCurveTo(mx, yB - (yB-yT)*.3, mx + hB*.82, yB - (yB-yT)*.34); ctx.stroke();
      }
    }
    // shrouds and ratlines
    ctx.strokeStyle = "rgba(40,28,14,.5)"; ctx.lineWidth = Math.max(.6, s*.0025);
    const foot = [-.05,-.032,.032,.05];
    for (const dxr of foot){ ctx.beginPath(); ctx.moveTo(mx + L*dxr*1.2, deck); ctx.lineTo(mx + mh*windLean*.3, top + mh*.44); ctx.stroke(); }
    for (let rl=1; rl<=4; rl++){ const fr=rl/5;
      ctx.beginPath();
      ctx.moveTo(mx + L*foot[0]*1.2*(1-fr), deck + (top+mh*.44 - deck)*fr);
      ctx.lineTo(mx + L*foot[3]*1.2*(1-fr), deck + (top+mh*.44 - deck)*fr); ctx.stroke(); }
    if (m >= 1) pennant(mx + mh*windLean*.4, top, s*.15, gal ? "#c62828" : "#b11f1f", t, m);
  }

  // ---- the sea at the stem, and a wake streak astern
  ctx.fillStyle = "rgba(255,255,255,.7)";
  const bw = Math.sin(t*2.2 + ph) * s*.005;
  ctx.beginPath(); ctx.ellipse(L*.5, keel*.7 + bw, s*.05, s*.014, -.3, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = .35;
  ctx.beginPath(); ctx.ellipse(-L*.5, keel*.72, s*.09, s*.011, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // ---- bowsprit and spritsail, and the jack staff
  ctx.strokeStyle = "#2e2110"; ctx.lineWidth = Math.max(1.5, s*.01);
  ctx.beginPath(); ctx.moveTo(L*.5, deck - free*.1); ctx.lineTo(L*.72, deck - s*.1); ctx.stroke();
  ctx.fillStyle = "rgba(244,236,214,.9)";
  ctx.beginPath();
  ctx.moveTo(L*.55, deck - free*.02);
  ctx.quadraticCurveTo(L*.61, deck + s*.025, L*.69, deck - s*.07);
  ctx.closePath(); ctx.fill();

  // ---- her colours, flying from the staffs
  if (gal){
    flyFlag(texBurgundy(), -L*.5, sStern - s*.16, s*.15, s*.1, t, ph);
    flyFlag(texBurgundy(), L*.73, deck - s*.11, s*.08, s*.055, t, ph+2, 1);
  } else {
    flyFlag(texRedEnsign(), -L*.47, sStern - s*.02, s*.16, s*.1, t, ph);
    flyFlag(texUnionJack(), L*.74, deck - s*.11, s*.07, s*.05, t, ph+2, 1);
  }

  ctx.restore();
}

// ------------------------------------------------- the gunnery between them
let puffs = [], flashes = [], splash2 = [];
let nextBroadside = 1.6;
function battleStep(dt, t){
  nextBroadside -= dt;
  if (nextBroadside <= 0){
    // they take turns
    const eng = Math.random() < .55;
    nextBroadside = 2.8 + Math.random()*3;
    const gx = eng ? W*.335 : W*.615, gy = HORIZON() + H*.115;
    const dir = eng ? 1 : -1;
    flashes.push({ x: gx, y: gy - H*.02, t: 0, dir });
    shoot();
    // a great bank of powder smoke rolling off her side
    for (let i = 0; i < 11; i++){
      puffs.push({
        x: gx + dir * (8 + Math.random()*58), y: gy - H*.005 - Math.random()*H*.06,
        r: 7 + Math.random()*13, a: .9,
        vx: dir * (16 + Math.random()*26), vy: -4 - Math.random()*8,
      });
    }
    if (puffs.length > 90) puffs.splice(0, puffs.length - 90);
    // bigger splashes, a short fall of them around the other hull
    const n = 3 + (Math.random()*3|0);
    for (let i = 0; i < n; i++){
      splash2.push({ x: W*.46 + (Math.random()-.5)*W*.16, y: gy + H*.015 + Math.random()*H*.05,
                     t: -(.2 + Math.random()*.6), big: Math.random() < .5 });
    }
    setTimeout(splashSound, 420);          // the shot falling into the sea
  }
  for (const p of puffs){
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 1 - dt*.7; p.vy *= 1 - dt*.4;
    p.x += dt * 14;                              // the wind carries it all east
    p.r += dt*17; p.a -= dt*.34;
  }
  puffs = puffs.filter(p => p.a > 0);
  for (const f of flashes) f.t += dt;
  flashes = flashes.filter(f => f.t < .14);
  for (const sp of splash2) sp.t += dt;
  splash2 = splash2.filter(sp => sp.t < 1);
}
function drawBattleFx(){
  for (const f of flashes){
    ctx.globalAlpha = 1 - f.t/.14;
    ctx.fillStyle = "#ffdf8a";
    ctx.beginPath();
    ctx.ellipse(f.x + f.dir*14, f.y, 26, 9, 0, 0, Math.PI*2);
    ctx.fill();
  }
  for (const sp of splash2){
    if (sp.t < 0) continue;
    const f = sp.t;
    const m = sp.big ? 2.1 : 1.3;
    ctx.globalAlpha = (1-f) * .9;
    ctx.fillStyle = "#ffffff";
    // the column of water thrown up
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y - f*H*.05*(1-f)*3, (H*.006 + f*H*.006)*m,
                H*.05*(1-f*.4)*m, 0, 0, Math.PI*2);
    ctx.fill();
    // the spreading ring at its foot
    ctx.beginPath();
    ctx.ellipse(sp.x, sp.y, (H*.016 + f*H*.03)*m, H*.007*m, 0, 0, Math.PI*2);
    ctx.fill();
    // a scatter of droplets at the top of the plume
    if (f < .5){
      for (let k2 = 0; k2 < 4; k2++){
        const a2 = k2*1.6 + sp.x;
        ctx.beginPath();
        ctx.arc(sp.x + Math.cos(a2)*H*.02*m*(f+.2),
                sp.y - H*.05*(1-f)*2.4*m + Math.sin(a2)*H*.01,
                H*.004*m, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
  for (const p of puffs){
    ctx.globalAlpha = Math.max(0, p.a) * .9;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(.7, "#eceae2");
    g.addColorStop(1, "rgba(236,234,226,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// -------------------------------------------------------------- loop
let last = performance.now(), T0 = last;
function frame(now){
  const dt = Math.min((now-last)/1000, .05); last = now;
  const t = (now - T0)/1000;
  const hz = HORIZON();

  drawSky(t);
  drawCape(t);
  drawSea(t);

  battleStep(dt, t);
  gullStep(dt);

  // the two of them, broadside to broadside off the cape:
  // the Englishman to windward on the left, the galleon to leeward
  drawProfileShip("english", W*.25, hz + H*.14, Math.min(W*.2, H*.4), 1, t, 0);
  drawProfileShip("galleon", W*.72, hz + H*.15, Math.min(W*.25, H*.5), -1, t, 2.2);

  drawBattleFx();

  // foreground swell, dark, for depth
  ctx.fillStyle = "rgba(14,70,110,.35)";
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W+30; x += 30){
    ctx.lineTo(x, H - H*.05 + Math.sin(x*.01 + t*.8)*H*.012);
  }
  ctx.lineTo(W, H);
  ctx.closePath(); ctx.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ------------------------------------------------------------- input
function play(ship){
  location.href = "play.html" + (ship ? "?ship=" + ship : "");
}
addEventListener("keydown", e => {
  const k = e.key;
  if (k === "Enter") play(null);
  if (k === "1") play("goldenhind");
  if (k === "2") play("desire");
  if (k === "3") play("duke");
  if (k === "4") play("centurion");
  startAudio();
});
addEventListener("pointerdown", startAudio);
let actx = null, themeOn = false;
function startAudio(){
  audioOn = true;
  if (themeOn) return;
  themeOn = true;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  fetch("theme-britannia.m4a").then(r => r.arrayBuffer())
    .then(b => actx.decodeAudioData(b))
    .then(buf => {
      const src2 = actx.createBufferSource();
      src2.buffer = buf; src2.loop = true;          // gapless, sample-accurate
      const g = actx.createGain(); g.gain.value = .5;
      src2.connect(g); g.connect(actx.destination);
      src2.start();
    }).catch(()=>{});
}
</script>
