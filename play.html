<meta charset="utf-8">
<title>Pacific Galleon &mdash; off Cabo San Lucas</title>
<style>
  :root{
    --ink:#133040; --dim:#3e5b69; --amber:#a85f10; --green:#1c7a4b; --red:#b03526;
    --display: Trattatello, Luminari, "Academy Engraved LET", serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#2e9fc6;color:var(--ink);overflow:hidden;
    font-family:var(--display);-webkit-font-smoothing:antialiased}
  #stage{position:absolute;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tl{position:absolute;left:clamp(14px,2.4vw,34px);top:clamp(12px,2vw,26px);pointer-events:none}
  .tr{position:absolute;right:clamp(14px,2.4vw,34px);top:clamp(12px,2vw,26px);text-align:right;pointer-events:none}
  .bl{position:absolute;left:clamp(14px,2.4vw,34px);bottom:clamp(12px,2vw,26px);pointer-events:none}
  .br{position:absolute;right:clamp(14px,2.4vw,34px);bottom:clamp(12px,2vw,26px);text-align:right;pointer-events:none}
  .k{font-size:clamp(10px,.82vw,13px);letter-spacing:.1em;color:var(--dim);line-height:1.85;
    text-shadow:0 1px 2px rgba(255,255,255,.45)}
  .k b{color:var(--ink);font-weight:400}
  .k .a{color:var(--amber)}
  .k .g{color:var(--green)}
  .k .r{color:var(--red)}
  .phase{font-size:clamp(15px,1.5vw,22px);color:var(--amber);letter-spacing:.06em;
    text-shadow:0 1px 2px rgba(255,255,255,.5)}
  .order{font-size:clamp(12px,1.05vw,16px);color:#1e3e50;max-width:34ch;line-height:1.5;
    text-shadow:0 1px 2px rgba(255,255,255,.5)}
  #card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,20,28,.8);transition:opacity .5s ease;z-index:5}
  #card.gone{opacity:0;pointer-events:none}
  .cardin{max-width:min(720px,84vw);padding:0 10px}
  .cardin h1{font-size:clamp(30px,4.6vw,66px);margin:0 0 .3em;font-weight:400;color:#f2f6f9}
  .cardin p{font-size:clamp(12px,1.12vw,17px);line-height:1.62;color:#c7d1da;margin:.5em 0}
  .cardin .src{font-size:clamp(10px,.86vw,13px);color:#8b97a3;line-height:1.7;margin-top:1.1em}
  .cardin .go{margin-top:1.3em;color:#f2a63c;font-size:clamp(12px,1.1vw,16px)}
  .bar{height:3px;background:rgba(19,48,64,.25);margin-top:6px;width:170px;display:inline-block}
  .bar i{display:block;height:100%;background:var(--amber)}
</style>

<div id="stage">
  <canvas id="sea"></canvas>
  <div class="tl">
    <div class="phase" id="phase"></div>
    <div class="order k" id="order"></div>
  </div>
  <div class="tr k" id="nav"></div>
  <div class="bl k" id="sail"></div>
  <div class="br k" id="chase"></div>
  <div id="card"><div class="cardin" id="cardin"></div></div>
</div>
<audio id="britannia" src="theme-britannia.m4a" loop preload="auto"></audio>
<audio id="grenadiers" src="grenadiers.m4a" preload="auto"></audio>

<script type="module">
// =====================================================================
// PACIFIC GALLEON off Cabo San Lucas, by day. The loop so far: lie in
// wait in the bay under the lee of Land's End, sight her coming down
// the coast, work out round the point, run her down, batter her rig
// with the broadside until she strikes, and lay her aboard. Boarding,
// treasure and the second Spaniard are next (PLAN.md).
// =====================================================================
import * as CV from "./cape.js";
import { CLASSES, makeShip, step, drawShip, degOf, norm } from "./ships.js";

const KN = CV.KN;
const cv = document.getElementById("sea");
const ctx = cv.getContext("2d", { alpha:false });
let W=0, H=0, DPR=1;
let bandCache = null;                 // the painted depth bands, invalidated on resize
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = Math.max(320, innerWidth); H = Math.max(240, innerHeight);
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bandCache = null;
}
addEventListener("resize", resize); resize();

const C = { foam:"#ffffff" };

// ------------------------------------------------------------- state
const params = new URLSearchParams(location.search);
const shipKey = CLASSES[params.get("ship")] ? params.get("ship") : "goldenhind";
const cls = CLASSES[shipKey];

let env, ship, prize, phase, elapsed, wp;
let reload = 0, smoke = [], balls = [], splashes = [];
let closure = 0, lastD = null, sailT = 0;
let hold = 0, chestT = 0, chestFly = null;   // what is left in her, the transfer
let preload = 0, pballs = [];                // HER guns, firing back at you
let consort = null, preload2 = 0, cballs = [];   // the second Spaniard (the Begona)
const GAL_NAMES = ["Nuestra Senora de Covadonga","Santa Ana","Encarnacion",
                   "Rosario","Santisima Trinidad","Pilar"];
let score = +(localStorage.getItem("pg_plunder") || 0);
let burn = 0, chestPops = [];                // she is afire; the +1s over your deck
let birds = [], gullWait = 10 + Math.random()*12;
let hits = [], damageFlash = 0, shake = 0;    // impact sparks, the red flash, a jolt
const PRIZE_HOLD = 120;                      // chests in her: far more than you can stow
function reset(){
  env = CV.makeWeather();
  ship = makeShip(shipKey, CV.AMBUSH.x, CV.AMBUSH.y, CV.AMBUSH.hdg);
  ship.canvas = .15;
  prize = makeShip("galleon", CV.LANE[2].x, CV.LANE[2].y, 110);
  prize.canvas = 1; prize.sink = 0;
  prize.name = GAL_NAMES[(Math.random()*GAL_NAMES.length)|0];
  wp = 3;
  phase = "brief"; elapsed = 0;
  reload = 0; smoke = []; balls = []; splashes = [];
  lastD = null; closure = 0;
  hold = PRIZE_HOLD; chestT = 0; chestFly = null;
  preload = 3; pballs = []; burn = 0; chestPops = [];
  birds = []; gullWait = 10 + Math.random()*12;
  hits = []; damageFlash = 0; shake = 0;
  consort = null; preload2 = 0; cballs = [];
  ship.rigDamage = 0; ship.damage = 0;
}
reset();

// ------------------------------------------------------------- camera
const cam = { x: CV.AMBUSH.x, y: CV.AMBUSH.y, span: 420 };
const T = {
  X: x => (x - cam.x) * T.k + W/2,
  Y: y => (y - cam.y) * T.k + H/2,
  S: v => v * T.k,
  k: 1,
};
function camUpdate(dt){
  // close enough to live aboard her; opens a little as the range does
  const d = Math.hypot(prize.x-ship.x, prize.y-ship.y);
  const want = Math.max(300, Math.min(560, d * .55 + 190));
  cam.span += (want - cam.span) * Math.min(1, dt*.8);
  const lead = 1.4;
  const bias = Math.min(.26, 160/Math.max(160, d));
  const tx = ship.x + ship.vx*lead + (prize.x-ship.x)*bias;
  const ty = ship.y + ship.vy*lead + (prize.y-ship.y)*bias;
  cam.x += (tx - cam.x) * Math.min(1, dt*3.0);
  cam.y += (ty - cam.y) * Math.min(1, dt*3.0);
  if (shake > 0){
    cam.x += (Math.random()-.5) * shake * 10;
    cam.y += (Math.random()-.5) * shake * 10;
  }
  T.k = W / Math.max(60, cam.span);
}

// -------------------------------------------------------- the water
// Tropical, lit, and readable like a chart: pale jade over the sand,
// turquoise on the bank, deep clean blue outside. Painted into an
// offscreen by depth band, exactly doghole's method, new palette.
const BANDS = [
  [5,   "#d8f2e4"],       // awash over sand
  [12,  "#aeeadf"],
  [24,  "#7ddcd9"],
  [45,  "#4cc2d2"],
  [85,  "#2fa6c8"],
  [150, "#2591bd"],
  [999, "#1d7fb0"],
];
function drawWater(){
  const step2 = 9;
  if (!bandCache || bandCache.k !== T.k || bandCache.cx !== Math.round(cam.x/6)
      || bandCache.cy !== Math.round(cam.y/6)){
    const oc = bandCache && bandCache.oc || document.createElement("canvas");
    oc.width = Math.ceil(W/step2)+2; oc.height = Math.ceil(H/step2)+2;
    const o = oc.getContext("2d");
    for (let j=0;j<oc.height;j++){
      for (let i=0;i<oc.width;i++){
        const wx = cam.x + ((i*step2) - W/2)/T.k;
        const wy = cam.y + ((j*step2) - H/2)/T.k;
        const ft = CV.depthAt(wx, wy);
        let col = BANDS[BANDS.length-1][1];
        for (const [lim,c] of BANDS) if (ft < lim){ col = c; break; }
        o.fillStyle = col; o.fillRect(i,j,1,1);
      }
    }
    bandCache = { oc, k:T.k, cx:Math.round(cam.x/6), cy:Math.round(cam.y/6) };
  }
  // upscaling the low-res band map with smoothing gives soft gradients
  // without the cost of a full-screen blur every frame
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bandCache.oc, 0, 0, W+step2, H+step2);
}

// sun on the water: small hard glints, world-anchored so they stream
// past as you sail. No grey rollers here; this is the sea you swim in.
function drawGlints(t){
  const cell = 22;
  const halfW = W/2/T.k, halfH = H/2/T.k;
  const i0 = Math.floor((cam.x-halfW)/cell), i1 = Math.ceil((cam.x+halfW)/cell);
  const j0 = Math.floor((cam.y-halfH)/cell), j1 = Math.ceil((cam.y+halfH)/cell);
  if ((i1-i0)*(j1-j0) > 5200) return;
  ctx.fillStyle = "#ffffff";
  for (let j=j0;j<=j1;j++){
    for (let i=i0;i<=i1;i++){
      const h = (((i*73856093) ^ (j*19349663)) >>> 0);
      const fx = i*cell + (h % 997)/997*cell;
      const fy = j*cell + ((h>>10) % 991)/991*cell;
      if (CV.depthAt(fx, fy) < 6) continue;        // cheap grid lookup, not a ray cast
      const ph = (h % 628)/100;
      const tw = Math.max(0, Math.sin(t*1.7 + ph));
      ctx.globalAlpha = tw*tw*tw * .5;
      ctx.fillRect(T.X(fx), T.Y(fy), Math.max(1,T.S(1.7)), Math.max(1,T.S(.6)));
    }
  }
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------ the land
function poly(pts, close=true){
  ctx.beginPath();
  ctx.moveTo(T.X(pts[0][0]), T.Y(pts[0][1]));
  for (let i=1;i<pts.length;i++) ctx.lineTo(T.X(pts[i][0]), T.Y(pts[i][1]));
  if (close) ctx.closePath();
}
function rnd2(i){
  let s2 = (i * 1103515245 + 12345) >>> 0;
  s2 = (s2 ^ (s2 >>> 15)) >>> 0;
  return (s2 % 100000) / 100000;
}
function onScreenW(x, y, pad){
  const sx = T.X(x), sy = T.Y(y);
  return sx > -pad && sx < W+pad && sy > -pad && sy < H+pad;
}
// The scrub, dust and granite are STATIC, so compute them ONCE (with the
// costly onLand / distToShore tests done here, not every frame) and just
// blit the on-screen ones each frame.
const LAND_FEATURES = (() => {
  const out = [];
  for (let i = 0; i < 1500; i++){
    const x = -5200 + rnd2(i*3) * 10400, y = -2600 + rnd2(i*3+1) * 1700;
    if (!CV.onLand(x, y)) continue;
    if (rnd2(i*3+2) > Math.min(1, CV.distToShore(x, y) / 160) * .9 + .1) continue;
    out.push({ x, y, r: 2.5 + rnd2(i*7)*6, rx: .8,
      col: rnd2(i*5) > .55 ? "rgba(116,134,76,.5)" : "rgba(92,112,64,.45)" });
  }
  for (let i = 0; i < 500; i++){
    const x = -5200 + rnd2(i*11+5) * 10400, y = -2600 + rnd2(i*11+6) * 1700;
    if (!CV.onLand(x, y)) continue;
    out.push({ x, y, r: 6 + rnd2(i*11+7)*14, rx: .7, col: "rgba(228,208,160,.22)" });
  }
  for (let i = 0; i < 160; i++){
    const f = rnd2(i*13+1);
    const x = f*205 + (rnd2(i*13+2)-.5)*170, y = f*-430 + (rnd2(i*13+3)-.5)*170;
    if (!CV.onLand(x, y)) continue;
    out.push({ x, y, r: 3.5 + rnd2(i*13+4)*8, rx: .85,
      col: rnd2(i*13+5) > .5 ? "rgba(192,178,152,.5)" : "rgba(156,142,118,.45)" });
  }
  return out;
})();

function drawLand(t){
  poly(CV.LAND);
  ctx.fillStyle = "#d9c391";                     // sunstruck arid ground
  ctx.fill();

  ctx.save();
  poly(CV.LAND); ctx.clip();

  // the static land dressing: only the features currently on screen
  for (const f of LAND_FEATURES){
    if (!onScreenW(f.x, f.y, 40)) continue;
    ctx.fillStyle = f.col;
    ctx.beginPath();
    ctx.ellipse(T.X(f.x), T.Y(f.y), T.S(f.r), T.S(f.r*f.rx), 0, 0, Math.PI*2);
    ctx.fill();
  }

  // the cliff face: a shadowed band along the whole coast
  ctx.strokeStyle = "rgba(96,78,52,.55)";
  ctx.lineWidth = Math.max(2, T.S(9));
  poly(CV.LAND); ctx.stroke();
  ctx.restore();

  // the beaches: pale sand laid along their runs, outside the clip so
  // the sand meets the water
  for (const [a0, a1] of CV.SAND_RUNS){
    ctx.strokeStyle = "#f2e4b6";
    ctx.lineWidth = Math.max(3, T.S(13));
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(T.X(CV.LAND[a0][0]), T.Y(CV.LAND[a0][1]));
    for (let i = a0+1; i <= a1; i++) ctx.lineTo(T.X(CV.LAND[i][0]), T.Y(CV.LAND[i][1]));
    ctx.stroke();
    // the waterline
    ctx.strokeStyle = "rgba(255,255,255,.75)";
    ctx.lineWidth = Math.max(1, T.S(1.6));
    ctx.beginPath();
    ctx.moveTo(T.X(CV.LAND[a0][0]), T.Y(CV.LAND[a0][1]));
    for (let i = a0+1; i <= a1; i++) ctx.lineTo(T.X(CV.LAND[i][0]), T.Y(CV.LAND[i][1]));
    ctx.stroke();
  }
}

// surf working along the shore
function drawSurf(t){
  ctx.save();
  ctx.lineCap = "round";
  for (let i = 0; i < CV.LAND.length; i++){
    const a = CV.LAND[i], b = CV.LAND[(i+1) % CV.LAND.length];
    if (a[1] < -1300 && b[1] < -1300) continue;          // skip inland edges
    if (!onScreenW((a[0]+b[0])/2, (a[1]+b[1])/2, 300)) continue;
    const len = Math.hypot(b[0]-a[0], b[1]-a[1]);
    const nx = (b[1]-a[1])/len, ny = -(b[0]-a[0])/len;
    const n = Math.max(2, Math.min(40, Math.floor(len/18)));
    for (let k = 0; k < n; k++){
      const f0 = k/n, f1 = (k+.72)/n;
      const ph = Math.sin(t*1.1 + i*1.7 + k*.8);
      const off = 3 + 5*Math.max(0, ph) + env.swell*14;
      ctx.globalAlpha = .18 + .4*Math.max(0, ph);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = Math.max(1, T.S(2));
      ctx.beginPath();
      ctx.moveTo(T.X(a[0]+(b[0]-a[0])*f0 + nx*off), T.Y(a[1]+(b[1]-a[1])*f0 + ny*off));
      ctx.lineTo(T.X(a[0]+(b[0]-a[0])*f1 + nx*off), T.Y(a[1]+(b[1]-a[1])*f1 + ny*off));
      ctx.stroke();
    }
  }
  ctx.restore();
}

const SHAPES = new Map();
function shapeOf(r, i){
  if (!SHAPES.has(i)) SHAPES.set(i, CV.rockShape(i*7919+13, r.r));
  return SHAPES.get(i);
}
function drawRocks(t){
  for (let i = 0; i < CV.ROCKS.length; i++){
    const r = CV.ROCKS[i];
    const px = T.X(r.x), py = T.Y(r.y);
    if (px < -140 || px > W+140 || py < -140 || py > H+140) continue;
    const sh = shapeOf(r, i);
    const brk = r.awash ? (.35 + .65*Math.max(0, Math.sin(t*.8 + r.x*.03))) : .5;

    ctx.globalAlpha = .07 + .18*brk;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(px, py, T.S(r.r*2.1), T.S(r.r*1.7), r.x, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.moveTo(px + T.S(sh[0][0]), py + T.S(sh[0][1]));
    for (const [sx2, sy2] of sh) ctx.lineTo(px + T.S(sx2), py + T.S(sy2));
    ctx.closePath();
    ctx.fillStyle = r.awash ? "#9fae9e" : "#b4a68c";
    ctx.fill();
    ctx.strokeStyle = "rgba(70,58,40,.7)";
    ctx.lineWidth = Math.max(1, T.S(.7));
    ctx.stroke();
    ctx.save(); ctx.clip();
    ctx.fillStyle = "rgba(255,246,222,.5)";              // the sunlit face
    ctx.beginPath();
    ctx.moveTo(px - T.S(r.r), py - T.S(r.r));
    ctx.lineTo(px + T.S(r.r*.5), py - T.S(r.r));
    ctx.lineTo(px - T.S(r.r*.45), py + T.S(r.r*.35));
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(60,46,30,.4)";
    ctx.beginPath();
    ctx.moveTo(px + T.S(r.r), py + T.S(r.r));
    ctx.lineTo(px + T.S(r.r), py - T.S(r.r*.2));
    ctx.lineTo(px - T.S(r.r*.2), py + T.S(r.r));
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // the arch itself: a window of bright water through the stone
    if (r.arch){
      ctx.strokeStyle = "#7ddcd9";
      ctx.lineWidth = Math.max(2, T.S(3.4));
      ctx.beginPath();
      ctx.moveTo(px - T.S(r.r*.55), py + T.S(r.r*.15));
      ctx.lineTo(px + T.S(r.r*.5), py - T.S(r.r*.25));
      ctx.stroke();
    }

    if (r.awash && brk > .6){
      ctx.globalAlpha = (brk-.6)*1.8;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(1, T.S(1.3));
      ctx.beginPath();
      ctx.ellipse(px, py, T.S(r.r*1.15), T.S(r.r*.9), r.x, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// wakes, left in the water where each of them actually was
function makeWakeOf(s){ return { s, pts: [], t: 0 }; }
const wakes = [];
function wakeStep(w, dt){
  w.t -= dt;
  if (w.t <= 0 && w.s.speedKn > .7){
    w.t = .09;
    w.pts.push({ x: w.s.x + (Math.random()-.5)*4, y: w.s.y + (Math.random()-.5)*4,
                 a: Math.min(1, w.s.speedKn/5), r: .9 + Math.random()*1.5 });
    if (w.pts.length > 110) w.pts.shift();
  }
  for (const p of w.pts){
    p.a -= dt*.42;
    p.x += env.curX * dt; p.y += env.curY * dt;
  }
  while (w.pts.length && w.pts[0].a <= 0) w.pts.shift();
}
function drawWakes(){
  // a lane of worked water astern, not a chain of clouds: small, thin,
  // and gone quickly
  for (const w of wakes) for (const p of w.pts){
    const age = 1 - Math.max(0, p.a);
    const r = (p.r || 1.2) * (.7 + age * 1.1);
    ctx.globalAlpha = Math.max(0, p.a) * .16;
    ctx.fillStyle = "#f2fdfd";
    ctx.beginPath();
    ctx.ellipse(T.X(p.x), T.Y(p.y), T.S(r), T.S(r*.55), 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------ the broadside
// SPACE fires every gun on the engaged side. The shot is chain and bar
// at the rig: what ends a chase is cutting her canvas off her, which
// is exactly how these fights were fought when the prize had to float
// afterward. Reload is honest work; keep your ship laid on her beam.
const RANGE = 420;
function gunBearing(target){
  const tg = target || prize;
  const dx = tg.x - ship.x, dy = tg.y - ship.y;
  const rel = norm(Math.atan2(dx, -dy) - ship.hdg);
  const a = Math.abs(rel) * 180/Math.PI;
  const d = Math.hypot(dx, dy);
  // the guns bear only when she is near ABEAM: line up your broadside
  return { rel, inArc: a > 62 && a < 118, side: rel > 0 ? 1 : -1, d, tg };
}
// of all the enemies afloat, the one your broadside can actually hit
function targetInArc(){
  let best = null;
  for (const e of [prize, consort]){
    if (!e || e.gone) continue;
    const g = gunBearing(e);
    if (g.inArc && g.d <= RANGE && (!best || g.d < best.d)) best = g;
  }
  return best;
}
function fire(){
  if (phase === "over" || phase === "brief" || reload > 0) return;
  reload = 6;
  const c = ship.cls;
  const nG = Math.max(3, Math.floor(c.len / 7));
  const g = targetInArc();                      // prize or consort, whichever bears
  const canHit = !!g;
  const tgt = g ? g.tg : null;
  const side = g ? g.side : (ship.lastSide || 1);
  ship.lastSide = side;
  sfxBroadside(nG);
  // shooting at nothing, the shot carries a long way; close in, hardly any
  const flight = canHit ? .3 + (g.d / RANGE) * .6 : .9 + Math.random()*.4;
  sfxWhistle(flight);
  const fx = Math.sin(ship.hdg), fy = -Math.cos(ship.hdg);
  const sx2 = Math.cos(ship.hdg), sy2 = Math.sin(ship.hdg);
  for (let i = 0; i < nG; i++){
    const along = -c.len * .26 + (i + .5) * (c.len * .5 / nG);
    const gx = ship.x + fx * along + sx2 * side * c.beam * .5;
    const gy = ship.y + fy * along + sy2 * side * c.beam * .5;
    for (let s2 = 0; s2 < 3; s2++){
      smoke.push({ x: gx, y: gy, r: 2 + Math.random()*2, a: .85,
        vx: sx2 * side * (6+Math.random()*5), vy: sy2 * side * (6+Math.random()*5) });
    }
    let tx, ty, hit = false;
    if (canHit){
      const spread = (Math.random()-.5) * (g.d * .22 + 18);
      tx = tgt.x + fx * spread * .4 + sx2 * (Math.random()-.5)*26;
      ty = tgt.y + fy * spread * .4 + sy2 * (Math.random()-.5)*26;
      hit = Math.random() < Math.max(.18, .8 - g.d / RANGE * .62);
    } else {
      // no one in the arc: the shot just goes out to sea and splashes
      const r = RANGE * (.7 + Math.random()*.5);     // a long way out to sea
      tx = gx + sx2 * side * r + (Math.random()-.5)*30;
      ty = gy + sy2 * side * r + (Math.random()-.5)*30;
    }
    balls.push({ x: gx, y: gy, tx, ty, t: 0,
      dur: flight * (.92 + Math.random()*.16), hit, target: tgt });
  }
}
// SHE FIRES BACK. Historically some of these galleons had their guns
// struck below; here every Spaniard can shoot, because a fight is more
// fun than a turkey shoot. She lays you when you are on her beam and
// inside range, and cuts your rig and hull about.
function prizeGunBearing(){
  const dx = ship.x - prize.x, dy = ship.y - prize.y;
  const rel = norm(Math.atan2(dx, -dy) - prize.hdg);
  const a = Math.abs(rel) * 180/Math.PI;
  return { inArc: a > 60 && a < 120, side: rel > 0 ? 1 : -1,
           d: Math.hypot(dx, dy) };
}
function prizeFire(){
  const g = prizeGunBearing();
  if (prize.struck || g.d > RANGE || preload > 0) return;
  preload = 9 + Math.random()*4;
  const c = prize.cls;
  const nG = Math.max(4, Math.floor(c.len / 6));
  const fx = Math.sin(prize.hdg), fy = -Math.cos(prize.hdg);
  const sx2 = Math.cos(prize.hdg), sy2 = Math.sin(prize.hdg);
  sfxBroadside(nG);
  const pflight = .3 + (g.d / RANGE) * .6;
  sfxWhistle(pflight);
  for (let i = 0; i < nG; i++){
    const along = -c.len*.26 + (i+.5)*(c.len*.5/nG);
    const gx = prize.x + fx*along + sx2*g.side*c.beam*.5;
    const gy = prize.y + fy*along + sy2*g.side*c.beam*.5;
    for (let s2 = 0; s2 < 3; s2++)
      smoke.push({ x: gx, y: gy, r: 2+Math.random()*2, a: .85,
        vx: sx2*g.side*(6+Math.random()*5), vy: sy2*g.side*(6+Math.random()*5) });
    const spread = (Math.random()-.5)*(g.d*.22+18);
    pballs.push({ x: gx, y: gy, tx: ship.x + fx*spread*.4 + sx2*(Math.random()-.5)*26,
      ty: ship.y + fy*spread*.4 + sy2*(Math.random()-.5)*26, t: 0,
      dur: .28 + g.d/RANGE*.3,
      hit: Math.random() < Math.max(.1, .42 - g.d/RANGE*.34) });
  }
}

function combatStep(dt){
  reload = Math.max(0, reload - dt);
  preload = Math.max(0, preload - dt);
  // she fires back whenever she can, in chase or alongside, until she strikes
  if (!prize.struck && (phase === "chase" || phase === "wait")) prizeFire();
  // her shot, incoming
  for (let i = pballs.length-1; i >= 0; i--){
    const b = pballs[i]; b.t += dt;
    if (b.t >= b.dur){
      if (b.hit){
        ship.rigDamage = Math.min(1, (ship.rigDamage||0) + .035);
        ship.damage += .075;
        hits.push({ x: b.tx, y: b.ty, t: 0, mine: false });
        damageFlash = .55; shake = 1;
        sfxHit();
      } else { splashes.push({ x: b.tx, y: b.ty, t: 0 }); }
      pballs.splice(i, 1);
    }
  }
  // she burns, once set alight: the fire grows and in a few seconds
  // she is destroyed
  if (burn > 0){
    burn += dt;
    for (let i = 0; i < 2; i++)
      smoke.push({ x: prize.x + (Math.random()-.5)*prize.cls.beam,
        y: prize.y + (Math.random()-.5)*prize.cls.len*.5, r: 3+Math.random()*3,
        a: .7, vx: (Math.random()-.5)*3, vy: -4-Math.random()*4, fire: Math.random()<.4 });
  }
  for (const s2 of smoke){
    s2.x += (s2.vx + env.curX*2) * dt; s2.y += (s2.vy + env.curY*2) * dt;
    const wr = (env.windNow ?? env.windFrom) * Math.PI/180;
    s2.x += -Math.sin(wr) * 8 * dt; s2.y += Math.cos(wr) * 8 * dt;
    s2.vx *= 1 - dt*1.6; s2.vy *= 1 - dt*1.6;
    s2.r += dt * 6; s2.a -= dt * (s2.fire ? .9 : .5);
  }
  smoke = smoke.filter(s2 => s2.a > 0);
  for (let i = balls.length-1; i >= 0; i--){
    const b = balls[i];
    b.t += dt;
    if (b.t >= b.dur){
      const tg = b.target || prize;
      if (b.hit){
        if (tg.struck){
          // a struck ship can still be battered under: round shot floods
          // her until she settles and goes down
          tg.flood = (tg.flood || 0) + .06;
          tg.sink = Math.min(.9, (tg.sink || 0) + .05);
          if (tg.flood >= 1) tg.gone = true;       // sunk by gunfire
        } else {
          tg.rigDamage = Math.min(1, (tg.rigDamage||0) + .09);
        }
        hits.push({ x: b.tx, y: b.ty, t: 0, mine: true });
        sfxHit();
      } else {
        splashes.push({ x: b.tx, y: b.ty, t: 0 });
        sfxSplash();
      }
      balls.splice(i, 1);
    }
  }
  // the Begona can be beaten off too: cut her rig up and she strikes and
  // falls away, no longer firing
  if (consort && !consort.struck && (consort.rigDamage||0) >= .75){
    consort.struck = true; consort.struckAt = env.t;
  }
  for (const sp of splashes) sp.t += dt;
  splashes = splashes.filter(sp => sp.t < .9);
  for (const p of chestPops) p.t += dt;
  chestPops = chestPops.filter(p => p.t < 1.1);
  for (const h of hits) h.t += dt;
  hits = hits.filter(h => h.t < .5);
  damageFlash = Math.max(0, damageFlash - dt);
  shake = Math.max(0, shake - dt*2.4);
  if (!prize.struck && (prize.rigDamage||0) >= .75){
    prize.struck = true; prize.struckAt = env.t;
    phase = "struck";
    spawnConsort();                   // her consort bears down to save her
  }
  // once she is afire she settles and goes down a little
  if (burn > 2.4) prize.sink = Math.min(.7, prize.sink + dt*.12);
  // the consort's guns at you
  preload2 = Math.max(0, preload2 - dt);
  for (let i = cballs.length-1; i >= 0; i--){
    const b = cballs[i]; b.t += dt;
    if (b.t >= b.dur){
      if (b.hit){
        ship.rigDamage = Math.min(1, (ship.rigDamage||0) + .035);
        ship.damage += .08;
        hits.push({ x: b.tx, y: b.ty, t: 0, mine: false });
        damageFlash = .55; shake = 1; sfxHit();
      } else { splashes.push({ x: b.tx, y: b.ty, t: 0 }); }
      cballs.splice(i, 1);
    }
  }
}
// ---------------------------------------------- the second Spaniard
function spawnConsort(){
  if (consort) return;
  // comes down out of the north-west, to seaward, a heavy man-of-war
  const a = (300 + Math.random()*30) * Math.PI/180;      // from the NW
  const r = 880;
  consort = makeShip("galleon", ship.x + Math.sin(a)*r, ship.y - Math.cos(a)*r, 135);
  consort.canvas = 1; consort.name = "the Begona"; consort.enemy = true;
}
function consortStep(dt){
  if (!consort || consort.gone) return;
  if (consort.struck){                      // beaten off: she falls astern, guns silent
    consort.canvas = Math.max(.05, consort.canvas - dt*.3);
    consort.helm = 0; return;
  }
  const want = Math.atan2(ship.x - consort.x, -(ship.y - consort.y));
  consort.helm = Math.max(-1, Math.min(1, norm(want - consort.hdg) * 2.5));
  consort.canvas = 1;
  // her broadside at you, when you are near her beam and in range
  const dx = ship.x - consort.x, dy = ship.y - consort.y;
  const rel = norm(Math.atan2(dx,-dy) - consort.hdg), a = Math.abs(rel)*180/Math.PI;
  const d = Math.hypot(dx,dy);
  if (!(a>55 && a<125) || d > RANGE || preload2 > 0) return;
  preload2 = 9 + Math.random()*4;
  const c = consort.cls, nG = Math.max(4, Math.floor(c.len/6));
  const fx = Math.sin(consort.hdg), fy = -Math.cos(consort.hdg);
  const sx2 = Math.cos(consort.hdg), sy2 = Math.sin(consort.hdg);
  const side = rel > 0 ? 1 : -1;
  sfxBroadside(nG); sfxWhistle(.3 + (d/RANGE)*.6);
  for (let i=0;i<nG;i++){
    const along = -c.len*.26 + (i+.5)*(c.len*.5/nG);
    const gx = consort.x + fx*along + sx2*side*c.beam*.5;
    const gy = consort.y + fy*along + sy2*side*c.beam*.5;
    for (let s2=0;s2<3;s2++)
      smoke.push({ x:gx, y:gy, r:2+Math.random()*2, a:.85,
        vx: sx2*side*(6+Math.random()*5), vy: sy2*side*(6+Math.random()*5) });
    const spread = (Math.random()-.5)*(d*.22+18);
    cballs.push({ x:gx, y:gy, tx: ship.x+fx*spread*.4+sx2*(Math.random()-.5)*26,
      ty: ship.y+fy*spread*.4+sy2*(Math.random()-.5)*26, t:0,
      dur: (.3+(d/RANGE)*.6)*(.92+Math.random()*.16),
      hit: Math.random() < Math.max(.1, .4 - d/RANGE*.32) });
  }
}

// ---------------------------------------------- grapple and board
function canBoard(){
  return prize.struck && Math.hypot(prize.x-ship.x, prize.y-ship.y) < 55;
}
function doBoard(){
  phase = "board";
  ship.canvas = Math.min(ship.canvas, .1);
}
function drawShots(){
  ctx.fillStyle = "#222222";
  for (const b of balls){
    const f = Math.min(1, b.t / b.dur);
    const x = b.x + (b.tx - b.x) * f, y = b.y + (b.ty - b.y) * f;
    ctx.beginPath();
    ctx.arc(T.X(x), T.Y(y), Math.max(1, T.S(.4)), 0, Math.PI*2);
    ctx.fill();
  }
  for (const sp of splashes){
    const f = sp.t / .9;
    ctx.globalAlpha = (1 - f) * .8;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(1, T.S(.9));
    ctx.beginPath();
    ctx.ellipse(T.X(sp.x), T.Y(sp.y), T.S(2 + f*7), T.S(1.4 + f*5), 0, 0, Math.PI*2);
    ctx.stroke();
    if (f < .4){
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(T.X(sp.x), T.Y(sp.y - 2*(1-f)), T.S(1.2), T.S(2.6*(1-f)), 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#222222";
  for (const b of pballs.concat(cballs)){
    const f = Math.min(1, b.t / b.dur);
    const x = b.x + (b.tx - b.x) * f, y = b.y + (b.ty - b.y) * f;
    ctx.beginPath(); ctx.arc(T.X(x), T.Y(y), Math.max(1, T.S(.4)), 0, Math.PI*2); ctx.fill();
  }
  for (const s2 of smoke){
    ctx.globalAlpha = Math.max(0, s2.a) * .8;
    ctx.fillStyle = s2.fire ? "#f2922a" : "#f4f2ec";
    ctx.beginPath();
    ctx.arc(T.X(s2.x), T.Y(s2.y), T.S(s2.r), 0, Math.PI*2);
    ctx.fill();
  }
  // impact bursts where shot strikes home: a bright flash, sparks, splinters
  for (const h of hits){
    const f = h.t / .5;
    const x = T.X(h.x), y = T.Y(h.y);
    ctx.globalAlpha = (1 - f);
    // the flash
    ctx.fillStyle = h.mine ? "#ffe08a" : "#ff9a5a";
    ctx.beginPath(); ctx.arc(x, y, T.S(2 + f*5), 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, T.S(1.2 + f*2), 0, Math.PI*2); ctx.fill();
    // splinters flung out
    ctx.strokeStyle = "rgba(60,42,22,.9)";
    ctx.lineWidth = Math.max(1, T.S(.5));
    for (let k = 0; k < 6; k++){
      const a2 = k*1.05 + h.x, r = f*T.S(9);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a2)*r, y + Math.sin(a2)*r);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // flames licking up off her when she burns
  if (burn > 0){
    for (let i = 0; i < 10; i++){
      const fl = Math.sin(env.t*9 + i*1.7);
      const fx = prize.x + (i/10 - .5) * prize.cls.len * .7;
      const fy = prize.y + (Math.random()-.5) * prize.cls.beam;
      ctx.globalAlpha = .5 + .4*Math.max(0, fl);
      ctx.fillStyle = i % 2 ? "#ffb43a" : "#e8531c";
      ctx.beginPath();
      ctx.ellipse(T.X(fx), T.Y(fy), T.S(1.4), T.S(3 + 2*Math.max(0,fl)), 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// --------------------------------------------------------------- AI
// She holds the coastwise track for Acapulco, waypoint to waypoint.
// Fired upon, she bears away a little and carries everything she has;
// struck, she rounds up and lies to.
function prizeStep(dt){
  if (prize.struck){
    prize.canvas = Math.max(.06, prize.canvas - dt*.4);
    prize.helm = 0;
    return;
  }
  const tgt = CV.LANE[Math.min(wp, CV.LANE.length-1)];
  if (Math.hypot(tgt.x - prize.x, tgt.y - prize.y) < 260 && wp < CV.LANE.length-1) wp++;
  let want = Math.atan2(tgt.x - prize.x, -(tgt.y - prize.y));
  if ((prize.rigDamage||0) > .05){
    // hauled at, she edges away from you toward the open sea
    const away = Math.atan2(prize.x - ship.x, -(prize.y - ship.y));
    want = want + norm(away - want) * .25;
  }
  const off = norm(want - prize.hdg);
  prize.helm = Math.max(-1, Math.min(1, off * 2.5));
  prize.canvas = 1;
}

// -------------------------------------------------------------- sound
// Synthesised in the page out of noise and oscillators, doghole's way,
// so the game owns its audio outright: the sea bed, the guns, shot
// striking home or falling short, canvas being worked, and the wreck.
let A = null, sfxGain = null, seaGain = null, seaFilt = null;
let windGain = null, windFilt = null, shotBuf = null, cashBuf = null, whistleBuf = null, gullBufs = [];
function audioInit(){
  if (A) return;
  try { A = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  if (A.state === "suspended") A.resume().catch(()=>{});
  sfxGain = A.createGain(); sfxGain.gain.value = 1; sfxGain.connect(A.destination);
  // ONE clean cannon report (the single Victory shot) per broadside,
  // and the cash register for treasure coming aboard
  fetch("cannon-one.m4a").then(r => r.arrayBuffer())
    .then(b => A.decodeAudioData(b)).then(b => { shotBuf = b; }).catch(()=>{});
  fetch("cash.m4a").then(r => r.arrayBuffer())
    .then(b => A.decodeAudioData(b)).then(b => { cashBuf = b; }).catch(()=>{});
  fetch("whistle.m4a").then(r => r.arrayBuffer())
    .then(b => A.decodeAudioData(b)).then(b => { whistleBuf = b; }).catch(()=>{});
  for (const f of ["gull1.m4a","gull2.m4a"])
    fetch(f).then(r => r.arrayBuffer())
      .then(b => A.decodeAudioData(b)).then(b => gullBufs.push(b)).catch(()=>{});
  const len = A.sampleRate * 2;
  const buf = A.createBuffer(1, len, A.sampleRate);
  const d = buf.getChannelData(0);
  let v = 0;
  for (let i=0;i<len;i++){ v = (v + (Math.random()*2-1)*.18) * .985; d[i] = v; }
  const src2 = A.createBufferSource(); src2.buffer = buf; src2.loop = true;
  seaFilt = A.createBiquadFilter(); seaFilt.type = "lowpass"; seaFilt.frequency.value = 520;
  seaGain = A.createGain(); seaGain.gain.value = 0;
  src2.connect(seaFilt); seaFilt.connect(seaGain); seaGain.connect(sfxGain);
  src2.start();
  const wsrc = A.createBufferSource(); wsrc.buffer = buf; wsrc.loop = true;
  wsrc.playbackRate.value = 1.7;
  windFilt = A.createBiquadFilter(); windFilt.type = "bandpass";
  windFilt.frequency.value = 700; windFilt.Q.value = .7;
  windGain = A.createGain(); windGain.gain.value = 0;
  wsrc.connect(windFilt); windFilt.connect(windGain); windGain.connect(sfxGain);
  wsrc.start();
}
function seaLevel(){
  if (!seaGain) return;
  const lvl = .045 + env.swell * .3 + Math.min(.1, ship.speedKn * .013);
  seaGain.gain.setTargetAtTime(lvl, A.currentTime, .3);
  seaFilt.frequency.setTargetAtTime(420 + env.swell*800 + ship.speedKn*40, A.currentTime, .4);
  // THE WIND IN THE SAILS: rises with how hard the canvas is actually
  // drawing, flutters a little, and goes silent in irons or becalmed
  if (windGain){
    const draw = Math.min(1, (ship.driveNow || 0) / 1.2);
    const flutter = 1 + Math.sin(env.t * 7.3) * .15;
    windGain.gain.setTargetAtTime(draw * .035 * flutter, A.currentTime, .3);
    windFilt.frequency.setTargetAtTime(560 + draw * 420 + env.swell * 300, A.currentTime, .3);
  }
}
// the cloth filling with a WHOMP when she comes out of irons or the lee
let wasDrawing = false;
function sailFillCheck(){
  const drawing = (ship.driveNow || 0) > .3 && ship.canvas > .25;
  if (drawing && !wasDrawing && A){
    playBuf(noiseBuf(.3, t2 => Math.sin(Math.PI * Math.min(1, t2*2.4)) * (1-t2)), .1,
            "lowpass", 800);
    tone("sine", 150, 70, .16, .04);
  }
  wasDrawing = drawing;
}
function noiseBuf(dur, curve){
  const n = Math.floor(A.sampleRate * dur);
  const b = A.createBuffer(1, n, A.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<n;i++){
    const t2 = i/n;
    d[i] = (Math.random()*2-1) * (curve ? curve(t2) : (1-t2));
  }
  return b;
}
function playBuf(buf, vol, filt, freq, q, delay){
  if (!A) return;
  const t0 = A.currentTime + (delay||0);
  const src2 = A.createBufferSource(); src2.buffer = buf;
  const g = A.createGain(); g.gain.value = vol;
  let node = src2;
  if (filt){
    const f = A.createBiquadFilter();
    f.type = filt; f.frequency.value = freq; if (q) f.Q.value = q;
    src2.connect(f); node = f;
  }
  node.connect(g); g.connect(sfxGain); src2.start(t0);
}
function tone(type, f0, f1, dur, vol, delay){
  if (!A) return;
  const t0 = A.currentTime + (delay||0);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0+dur+.03);
}
// A BROADSIDE: ONE cannon report, the single cut, with a deep synth
// boom under it for weight. Not the long rolling recording.
function sfxBroadside(nG){
  if (!A) return;
  // a rolling burst: three reports a fraction apart, down the ship's side
  const shots = Math.max(2, Math.min(4, Math.round((nG||4)/2)));
  if (shotBuf){
    for (let i = 0; i < shots; i++){
      const s2 = A.createBufferSource(); s2.buffer = shotBuf;
      s2.playbackRate.value = .9 + Math.random()*.2;
      const g = A.createGain(); g.gain.value = .6 - i*.08;
      s2.connect(g); g.connect(sfxGain);
      s2.start(A.currentTime + i * (.07 + Math.random()*.06));
    }
  }
  tone("triangle", 66 + Math.random()*12, 26, .55, .34);
  tone("triangle", 80 + Math.random()*12, 30, .4, .2, .1);
}
// the shot whistling THROUGH its flight: it starts just after the bang
// and is cut the instant the ball lands, so the whistle tracks the shot.
// flight = the ball's time in the air, in seconds.
function sfxWhistle(flight){
  if (!A || !whistleBuf || flight < .4) return;   // no whistle at close range
  const s2 = A.createBufferSource(); s2.buffer = whistleBuf;
  s2.playbackRate.value = 1.25 - Math.min(.5, flight*.5);   // longer flight, lower
  const g = A.createGain();
  s2.connect(g); g.connect(sfxGain);
  const t0 = A.currentTime + .1;                            // just after the bang
  const end = t0 + Math.max(.18, flight - .06);             // cut as it lands
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(.16, t0 + .06);       // well under the guns
  g.gain.setValueAtTime(.16, Math.max(t0 + .07, end - .05));
  g.gain.exponentialRampToValueAtTime(.0001, end);
  s2.start(t0); s2.stop(end + .03);
}
// treasure over the rail: the cash register, cut short
function sfxChest(){
  if (cashBuf){
    const s2 = A.createBufferSource(); s2.buffer = cashBuf;
    s2.playbackRate.value = .97 + Math.random()*.08;
    const g = A.createGain(); g.gain.value = .5;
    s2.connect(g); g.connect(sfxGain); s2.start();
  } else {
    tone("sine", 1250, 900, .07, .06);
    tone("sine", 1850, 1300, .05, .04, .03);
  }
}
function sfxGull(){
  if (!A || !gullBufs.length) return;
  // two overlapping cries so a passing flock is clearly heard
  for (let i = 0; i < 2; i++){
    const s2 = A.createBufferSource(); s2.buffer = gullBufs[(Math.random()*gullBufs.length)|0];
    s2.playbackRate.value = .92 + Math.random()*.16;
    const g = A.createGain(); g.gain.value = .4 + Math.random()*.18;

// The Marcha Real, slow and in the old style, rises when the galleon is

function music(id, on, vol){

// ------------------------------------------------------------- input
const keys = {};
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === "enter"){
    if (phase === "brief"){ hideCard(); phase = "wait"; audioInit(); applyMute(); music("britannia", true, .45); }
    else if (phase === "over"){
      music("grenadiers", false);
      reset(); hideCard(); phase = "wait"; music("britannia", true, .45);
    }
  }
  if (k === "m"){
    muted = !muted;
    localStorage.setItem("pg_muted", muted ? "1" : "0");
    applyMute();
  }
  if (k === " "){
    e.preventDefault();
    fire();                                    // SPACE: the broadside, any time
  }
  if (k === "g"){                              // G: grapple a struck ship; press again to cast off
    if (phase === "struck" && canBoard()) doBoard();
    else if (phase === "board") castOff();
  }
  if (k === "c"){
    if (phase === "board") castOff();          // C: take your gold and slip away
  }
  if (k === "x"){
    if (phase === "board") burnHer();          // X: fire her and leave her burning
  }
  if (k === "escape") location.href = "index.html";
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

// --------------------------------------------------------------- HUD
function pts(deg){
  const n = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return n[Math.round(((deg%360)+360)%360/22.5)%16];
}
function pointOfSail(s){
  const a = Math.abs(s.awa) * 180/Math.PI;
  if (s.inIrons) return '<span class="r">In irons: helm over and bear away</span>';
  if (s.becalmed) return '<span class="a">The cape has your wind: work her out</span>';
  if (a < s.cls.polar.irons + 12) return "Close-hauled, as near as she will lie";
  if (a < 100) return "A beam reach";
  if (a < 155) return '<span class="g">The wind on her quarter: her best point</span>';
  return "Running square";
}
function hud(){
  const d = Math.hypot(prize.x-ship.x, prize.y-ship.y);
  const brg = degOf(Math.atan2(prize.x-ship.x, -(prize.y-ship.y)));
  const uk = ship.underKeel;
  const ukc = uk < 4 ? "r" : uk < 12 ? "a" : "g";
  el("nav").innerHTML = `
    <div>Head <b>${pts(degOf(ship.hdg))} ${degOf(ship.hdg).toFixed(0)}&deg;</b></div>
    <div>Speed <b>${ship.speedKn.toFixed(1)} kn</b></div>
    <div>Under the keel <span class="${ukc}"><b>${uk>0?uk.toFixed(0):"AGROUND"}</b>${uk>0?" ft":""}</span></div>
    <div>Wind <b>${pts(env.windNow ?? env.windFrom)} ${(env.windKnNow ?? env.windKn).toFixed(0)} kn</b></div>
    <div>Current sets <b>${pts(degOf(Math.atan2(env.curX,-env.curY)))}</b> ${(Math.hypot(env.curX,env.curY)/KN).toFixed(2)} kn</div>`;
  const g = gunBearing();
  el("sail").innerHTML = `
    <div>Canvas <b>${(ship.canvas*100).toFixed(0)}%</b> <span class="bar"><i style="width:${ship.canvas*100}%"></i></span></div>
    <div>${pointOfSail(ship)}</div>
    <div>${reload > 0
      ? `<span class="a">Guns reloading&hellip; ${reload.toFixed(0)}s</span>`
      : g.inArc && g.d <= RANGE
        ? `<span class="g">SPACE &mdash; the ${g.side>0?"starboard":"larboard"} broadside</span>`
        : g.inArc && g.d <= RANGE
          ? `<span class="g">SPACE &mdash; the ${g.side>0?"starboard":"larboard"} broadside</span>`
          : '<span class="g">SPACE &mdash; fire a broadside</span>'}</div>
    ${(ship.damage > .02 || (ship.rigDamage||0) > .02) ? `<div class="r">Your ship: ${
      ship.damage > .66 ? "sorely battered" : ship.damage > .3 ? "knocked about" : "taking hits"}${
      (ship.rigDamage||0) > .05 ? ", rigging cut" : ""}</div>` : ""}`;
  el("chase").innerHTML =
    phase === "board" ? `
    <div>Treasure aboard <b>${Math.floor(ship.cargo)}</b> / ${cls.cap} chests</div>
    <div>Left in her hold <b>${hold}</b></div>
    <div class="a">Every chest slows you</div>
    <div class="g">G or C &mdash; cast off and run with your gold</div>
    <div class="r">X &mdash; fire her and leave her burning</div>`
    : phase === "escape" ? (() => {
      const threat = consort || prize;
      const dT = Math.hypot(threat.x-ship.x, threat.y-ship.y);
      const goal = consort ? 1300 : 750;
      return `
    <div>Treasure aboard <b>${Math.floor(ship.cargo)}</b> / ${cls.cap} chests</div>
    <div>${consort ? "Outrun the Begon&#771;a" : "Get clear"} <b>${Math.max(0, goal - Math.round(dT))} yd</b> to go</div>
    ${consort && dT < 500 ? '<div class="r">She is on you &mdash; crowd on sail!</div>' : ""}`;
    })()
    : phase === "struck" ? `
    <div>She has struck &mdash; <b>${d < 1000 ? Math.round(d) + " yd" : (d/CV.YD_PER_NM).toFixed(1) + " nm"}</b> off</div>
    <div>${d < 55 ? '<span class="g">G &mdash; grapple and board</span>' : '<span class="a">Close alongside to board</span>'}</div>

    : (phase !== "brief" && phase !== "over") ? `
    <div>The galleon <b>${pts(brg)}</b>, <b>${d < 1000 ? Math.round(d) + " yd" : (d/CV.YD_PER_NM).toFixed(1) + " nm"}</b></div>
    <div>${closure > .05 ? `<span class="g">Closing, ${closure.toFixed(1)} kn</span>`

  const orders = {

  el("order").textContent = orders[phase] || "";
}

// the edge mark when she is off the screen
function drawSailMark(){
  const sx = T.X(prize.x), sy = T.Y(prize.y);
  if (sx > 40 && sx < W-40 && sy > 40 && sy < H-40) return;
  const cx = W/2, cy = H/2;
  const a = Math.atan2(sy-cy, sx-cx);
  const r = Math.min(W,H)*.42;
  const px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
  ctx.save();
  ctx.translate(px, py); ctx.rotate(a);
  ctx.globalAlpha = .7; ctx.fillStyle = "#a85f10";
  ctx.beginPath(); ctx.moveTo(13,0); ctx.lineTo(-8,6); ctx.lineTo(-8,-6);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = .75; ctx.fillStyle = "#a85f10";
  ctx.font = "13px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center";
  ctx.fillText(prize.struck ? "the prize" : "a sail", px - Math.cos(a)*30, py - Math.sin(a)*30 + 4);
  ctx.globalAlpha = 1;
}

// a little side-elevation of YOUR ship, filling with gold as you loot,
// the way doghole shows the deckload growing
// a detailed side elevation of YOUR OWN ship, cut away so you watch her
// hold fill with gold. Drawn FROM THE SHIP CLASS, so the Golden Hind is
// small and lean and the Centurion long and high-charged.
function drawTreasureInset(){
  const c = cls;
  const panelW = Math.min(320, W*.3), px0 = W - panelW - 24, py0 = H - 164;
  ctx.save();
  // backing panel
  ctx.globalAlpha = .92;
  ctx.fillStyle = "rgba(10,28,36,.62)";
  ctx.fillRect(px0 - 14, py0 - 70, panelW + 28, 150);
  ctx.strokeStyle = "rgba(180,200,214,.2)"; ctx.lineWidth = 1;
  ctx.strokeRect(px0 - 14, py0 - 70, panelW + 28, 150);

  // her proportions, scaled to fit the panel (len 25..46 -> same width,
  // but taller castles and deeper hull as the class grows)
  const L = panelW, cx = px0 + L/2, wl = py0 + 8;     // waterline
  const big = (c.len - 25) / 21;                       // 0 Golden Hind .. 1 Centurion
  const hullH = 26 + big*10;                           // freeboard
  const castle = c.castles;                            // .4 .. 1
  const deck = wl - hullH;
  const k = L / 2;

  const col = { hull:c.wale, lo:"#241708", band:c.paint||"#6f4a22",
                wale:c.accent, works:c.castle, gild:c.accent, deck:c.deck };

  // the water she floats in
  ctx.fillStyle = "rgba(60,160,180,.25)";
  ctx.fillRect(px0 - 8, wl, L + 16, 64);

  // ---- the hull: raked stem right, transom left, keel below the waterline
  ctx.fillStyle = col.hull;
  ctx.beginPath();
  ctx.moveTo(px0, deck + 4);                            // transom top (stern, left)
  ctx.quadraticCurveTo(px0 - 6, wl + 10, px0 + 14, wl + 16);  // sternpost + keel
  ctx.lineTo(px0 + L - 18, wl + 16);
  ctx.quadraticCurveTo(px0 + L + 8, wl + 2, px0 + L, deck + 2); // forefoot + stem
  ctx.lineTo(px0 + L - 4, deck - 2);
  ctx.lineTo(px0 + 2, deck + 1);
  ctx.closePath(); ctx.fill();
  // underbody shadow
  ctx.save();
  ctx.beginPath(); ctx.rect(px0 - 8, wl, L + 16, 40); ctx.clip();
  ctx.fillStyle = col.lo;
  ctx.beginPath();
  ctx.moveTo(px0 + L, wl); ctx.quadraticCurveTo(px0 + L + 8, wl + 2, px0 + L - 18, wl + 16);
  ctx.lineTo(px0 + 14, wl + 16); ctx.quadraticCurveTo(px0 - 6, wl + 10, px0, wl);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // ---- the CUTAWAY hold, filling with gold chests (the point of it)
  const holdX = px0 + 16, holdW = L - 34, holdTop = deck + 8, holdBot = wl + 10;
  ctx.fillStyle = "rgba(20,14,8,.55)";                 // the dark hold
  ctx.fillRect(holdX, holdTop, holdW, holdBot - holdTop);
  const cols = Math.round(9 + big*4), rows = 3;
  const cw = holdW / cols, rh = (holdBot - holdTop) / rows;
  const frac = c.cap ? ship.cargo / c.cap : 0;
  let n = Math.round(frac * cols * rows);
  for (let r2 = 0; r2 < rows && n > 0; r2++){
    for (let c2 = 0; c2 < cols && n > 0; c2++){
      const gx = holdX + c2*cw + 1, gy = holdBot - (r2+1)*rh + 1;
      ctx.fillStyle = (c2 + r2) % 2 ? "#c8781f" : "#f2a63c";
      ctx.fillRect(gx, gy, cw - 2, rh - 2);
      ctx.fillStyle = "rgba(255,235,170,.6)";          // a glint of lid
      ctx.fillRect(gx, gy, cw - 2, 2);
      n--;
    }
  }

  // ---- wales, gunports, and the painted strake over the hold
  if (c.paint){ ctx.strokeStyle = c.paint; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(px0 + 2, deck + 10); ctx.lineTo(px0 + L - 4, deck + 8); ctx.stroke(); }
  ctx.strokeStyle = col.wale; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px0 + 2, deck + 9); ctx.lineTo(px0 + L - 4, deck + 7); ctx.stroke();
  const decks = c.decks || 1, nP = Math.round(5 + big*5);
  for (let d = 0; d < decks; d++){
    for (let i = 0; i < nP; i++){
      const gx = px0 + 18 + i*(L - 40)/(nP-1);
      ctx.fillStyle = "#15100a"; ctx.fillRect(gx - 3, deck + 12 + d*9, 6, 6);
      ctx.fillStyle = "#8a1410"; ctx.fillRect(gx - 3, deck + 8 + d*9, 6, 3);
    }
  }

  // ---- upperworks: quarterdeck aft (left) and forecastle, scaled by castle
  ctx.fillStyle = col.works;
  const qh = 10 + castle*26;
  ctx.fillRect(px0, deck - qh, L*0.26, qh + 2);                       // quarterdeck/sterncastle
  ctx.fillRect(px0 + L*0.72, deck - (6 + castle*10), L*0.26, 6 + castle*10); // forecastle
  if (castle >= 1){                                                   // galleon-style gallery
    ctx.fillStyle = col.gild;
    for (let i=0;i<3;i++) ctx.fillRect(px0, deck - qh + i*qh/3, L*0.2, 2);
  } else {                                                            // quarter windows
    ctx.fillStyle = "#cdbb90";
    for (let i=0;i<3;i++) ctx.fillRect(px0 + 4 + i*10, deck - qh + 5, 7, 7);
  }

  // ---- three masts with yards, taller amidships
  ctx.strokeStyle = "#241a0c"; ctx.lineWidth = 2.5;
  const mast = [0.16, 0.5, 0.82], mh = [0.74, 1, 0.68];
  for (let m = 0; m < 3; m++){
    const mx = px0 + L*mast[m], top = deck - (58 + big*22)*mh[m];
    ctx.beginPath(); ctx.moveTo(mx, deck - (m===0?qh:0)); ctx.lineTo(mx, top); ctx.stroke();
    ctx.lineWidth = 1.6;                                              // a couple of yards
    for (const yf of [0.4, 0.68]){
      const yy = deck - (58 + big*22)*mh[m]*yf;
      ctx.beginPath(); ctx.moveTo(mx - 11*mh[m], yy); ctx.lineTo(mx + 11*mh[m], yy); ctx.stroke();
    }
    ctx.lineWidth = 2.5;
  }
  // bowsprit
  ctx.beginPath(); ctx.moveTo(px0 + L - 2, deck + 2); ctx.lineTo(px0 + L + 10, deck - 10); ctx.stroke();

  // the readout
  ctx.fillStyle = "#e7eef4";
  ctx.font = "13px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "right";
  ctx.fillText(`${Math.floor(ship.cargo)} / ${c.cap} chests  ·  ${c.name}`, px0 + L, py0 - 54);
  ctx.restore();
}
function drawChestPops(){
  ctx.save();
  ctx.textAlign = "center";
  for (const p of chestPops){
    const f = p.t / 1.1;
    ctx.globalAlpha = Math.max(0, 1 - f);
    ctx.fillStyle = "#f2d64a";
    ctx.font = `${Math.round(T.S(5))}px ` + getComputedStyle(document.body).fontFamily;
    ctx.fillText("+1 chest", T.X(ship.x), T.Y(ship.y) - T.S(6) - f*40);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawSinking(s){
  const k = s.sink, L = s.cls.len, B = s.cls.beam;
  // the sea closing dark over her settling hull
  ctx.save();
  ctx.globalAlpha = Math.min(.7, k * .9);
  ctx.fillStyle = "#15566e";
  ctx.beginPath();
  ctx.ellipse(T.X(s.x), T.Y(s.y), T.S(B*.6), T.S(L*.5), s.hdg, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  // a spreading ring of foam and rising bubbles
  ctx.strokeStyle = "rgba(255,255,255,.5)";
  ctx.lineWidth = Math.max(1, T.S(.8));
  ctx.beginPath();
  ctx.ellipse(T.X(s.x), T.Y(s.y), T.S(B*.7 + k*B), T.S(L*.5 + k*B), s.hdg, 0, Math.PI*2);
  ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.6)";
  for (let i = 0; i < 10; i++){
    const a2 = i*1.3 + s.x, rr = (i%3 + 1) * B * .3;
    ctx.beginPath();
    ctx.arc(T.X(s.x + Math.cos(a2)*rr), T.Y(s.y + Math.sin(a2)*rr),
            Math.max(1, T.S(.5 + Math.random()*.6)), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function drawBirds(t){
  ctx.strokeStyle = "rgba(60,74,86,.6)";
  ctx.lineWidth = Math.max(1, T.S(.5));
  for (const b of birds){
    const x = T.X(b.x), y = T.Y(b.y);
    if (x < -20 || x > W+20 || y < -20 || y > H+20) continue;
    const s2 = T.S(5), flap = Math.sin(t*7 + b.x*.1) * .5;
    ctx.beginPath();
    ctx.moveTo(x - s2, y + s2*flap);
    ctx.quadraticCurveTo(x - s2*.3, y - s2*.5, x, y);
    ctx.quadraticCurveTo(x + s2*.3, y - s2*.5, x + s2, y + s2*flap);
    ctx.stroke();
  }
}
// a name plate and a health bar floating above a ship
function label(s, name, frac, enemy, note){
  const x = T.X(s.x), y = T.Y(s.y) - T.S(s.cls.len*.5) - 16;
  if (x < -80 || x > W+80 || y < -30 || y > H+30) return;
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = "600 12px " + getComputedStyle(document.body).fontFamily;
  const w = Math.max(70, ctx.measureText(name).width + 18);
  // a dark plate
  ctx.globalAlpha = .82; ctx.fillStyle = "rgba(10,26,34,.72)";
  ctx.fillRect(x - w/2, y - 15, w, 28);
  ctx.globalAlpha = 1;
  // the name
  ctx.fillStyle = enemy ? "#f0c0a0" : "#dff0ea";
  ctx.fillText(name, x, y - 2);
  // the bar
  const bw = w - 14, bx = x - bw/2, by = y + 5;
  ctx.fillStyle = "rgba(150,170,184,.25)"; ctx.fillRect(bx, by, bw, 5);
  if (note){
    ctx.fillStyle = "#7fd6a2"; ctx.font = "700 9px " + getComputedStyle(document.body).fontFamily;
    ctx.fillText(note, x, by + 4.5);
  } else {
    const f = Math.max(0, Math.min(1, frac));
    const col = enemy ? (f>.5?"#e0a24a":"#d2603f")
                      : (f>.5?"#5bbf7a":f>.25?"#d8a23a":"#d2603f");
    ctx.fillStyle = col; ctx.fillRect(bx, by, bw*f, 5);
  }
  ctx.restore();
}
function drawLabels(){
  if (phase === "brief" || phase === "over") return;
  // you
  label(ship, "H.M.S. " + ship.cls.name,
        1 - Math.min(1, ship.damage/1.5), false);
  // the prize
  const prizeNote = prize.struck ? "STRUCK" : null;
  label(prize, prize.name || "the galleon",
        1 - Math.min(1, (prize.rigDamage||0)/.75), true, prizeNote);
  // her consort
  if (consort) label(consort, consort.name || "the consort", 1, true);
}
// a cannon that fills back up as the guns reload, to show you are ready
function drawReloadIcon(){
  const cx = W/2, cy = H - 52, w = 58, h = 20;
  const prog = Math.max(0, Math.min(1, 1 - reload/6));   // 0 just fired .. 1 ready
  const ready = reload <= 0;
  ctx.save();
  ctx.translate(cx, cy);
  // the carriage + barrel silhouette
  ctx.fillStyle = "#1c1712";
  ctx.fillRect(-w/2, -h*.2, w*.78, h*.34);               // barrel
  ctx.fillRect(w*.26, -h*.08, w*.14, h*.5);              // muzzle swell
  ctx.fillStyle = "#3a2a1a";
  ctx.beginPath(); ctx.arc(-w*.28, h*.42, 5, 0, Math.PI*2);  // wheels
  ctx.arc(-w*.02, h*.42, 5, 0, Math.PI*2); ctx.fill();
  // the powder fill behind, rising as she reloads
  ctx.globalAlpha = .9;
  ctx.fillStyle = "rgba(150,170,184,.2)"; ctx.fillRect(-w/2-4, -h*.9, w+8, h*1.5);
  ctx.fillStyle = ready ? "#f2a63c" : "#9c6b2a";
  ctx.fillRect(-w/2-4, h*.6 - (h*1.5)*prog, w+8, (h*1.5)*prog);
  // label
  ctx.globalAlpha = 1;
  ctx.textAlign = "center";
  ctx.font = "700 10px " + getComputedStyle(document.body).fontFamily;
  ctx.fillStyle = ready ? "#f2d6a0" : "#8fa8b8";
  ctx.fillText(ready ? "GUNS READY" : "reloading", 0, -h*.9 - 4);
  if (ready){                                            // a glow when loaded
    ctx.strokeStyle = "rgba(242,166,60,.7)"; ctx.lineWidth = 2;
    ctx.strokeRect(-w/2-5, -h*.95, w+10, h*1.6);
  }
  ctx.restore();
}
function drawRose(){
  const R = Math.min(90, W*.07), cx = W - R - 34, cy = 210 + R;
  ctx.save();
  ctx.globalAlpha = .85;
  ctx.strokeStyle = "rgba(19,48,64,.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R*.62, 0, Math.PI*2); ctx.stroke();
  for (let i=0;i<16;i++){
    const a = i*Math.PI/8 - Math.PI/2;
    const r0 = i%4 ? R*.9 : R*.78;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    ctx.stroke();
  }
  ctx.fillStyle = "#3e5b69";
  ctx.font = "10px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "center";
  ctx.fillText("N", cx, cy - R - 6);
  const arrow = (dirDeg, len, col, wid) => {
    const a = (dirDeg - 90) * Math.PI/180;
    const ex = cx + Math.cos(a)*len, ey = cy + Math.sin(a)*len;
    ctx.strokeStyle = col; ctx.lineWidth = wid;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(-5,4); ctx.lineTo(-5,-4);
    ctx.closePath(); ctx.fill(); ctx.restore();
  };
  arrow(((env.windNow ?? env.windFrom) + 180) % 360, R*.82, "rgba(19,48,64,.75)", 2);
  const setDir = (Math.atan2(env.curX, -env.curY)*180/Math.PI + 360) % 360;
  arrow(setDir, R*.56, "rgba(168,95,16,.95)", 2.4);
  arrow(degOf(ship.hdg), R*.4, "rgba(28,122,75,.95)", 2);
  ctx.globalAlpha = .75; ctx.fillStyle = "#3e5b69";
  ctx.textAlign = "right";
  ctx.fillText("wind", cx + R, cy + R + 14);
  ctx.fillStyle = "#a85f10"; ctx.fillText("current", cx + R, cy + R + 27);
  ctx.fillStyle = "#1c7a4b"; ctx.fillText("her head", cx + R, cy + R + 40);
  ctx.restore();
}

// ------------------------------------------------------------ hazards
function hazards(dt){
  for (const r of CV.ROCKS){
    const d = Math.hypot(ship.x-r.x, ship.y-r.y);
    if (d < r.r + 6){
      failCard(ship.speedKn > 1.4 ? "Struck on the rocks" : "On the rocks",
        `You went onto ${r.name} at ${ship.speedKn.toFixed(1)} knots, within sight of the
         richest prize on earth.`);
      return;
    }
  }
  if (ship.underKeel < 0){
    if (CV.onLand(ship.x, ship.y) || ship.underKeel < -3){
      failCard("Ashore", `She took the ground drawing ${ship.draftFt.toFixed(1)} feet.
        On the Medano sand you might kedge her off; the game does not let you yet.`);
      return;
    }
    ship.damage += dt*.4;
  }
  if (ship.damage > 1) failCard("Bilged", "She pounded too long on the bank and opened up.");
}

// ---------------------------------------------- boarding and treasure
// Grappled, the chests come over the rail one by one. Every chest is
// money and every chest is weight: the cargo term in the physics means
// the longer you stay, the slower you run. You will not empty her;
// Cavendish could not either.
function boardStep(dt){
  // the grapple is doghole's warp code with a moving target
  ship.warp = { x: prize.x, y: prize.y, hdg: prize.hdg };
  ship.lines = 3;
  prize.canvas = 0;
  if (ship.cargo < cls.cap && hold > 0){
    chestT += dt;
    if (chestT > 1.1){
      chestT = 0;
      chestFly = { f: 0 };
      ship.cargo += 1; hold -= 1;
      chestPops.push({ t: 0 });
      sfxChest();
    }
  }
  if (chestFly){
    chestFly.f += dt * 2.2;
    if (chestFly.f >= 1) chestFly = null;
  }
}
function castOff(){
  ship.warp = null; ship.lines = 0; chestFly = null;
  phase = "escape";
  if (A) playBuf(noiseBuf(.4, t2 => (1-t2)**1.6), .14, "bandpass", 2400, .7);
}
// fire her: a broadside into the prize at point blank, the grapnels cut,
// and she is left burning as you sheer off
function burnHer(){
  sfxBroadside(8);
  sfxFire();
  burn = 0.0001;
  ship.warp = null; ship.lines = 0; chestFly = null;
  phase = "escape";
}

// ------------------------------------------------------------- phases
function phasesStep(dt){
  const d = Math.hypot(prize.x-ship.x, prize.y-ship.y);
  if (phase === "wait" && d < 1700){ phase = "chase"; }
  if ((phase === "chase" || phase === "struck") && prize.x > CV.ESCAPE_X && !prize.struck) loseCard();
  if (prize.gone && (phase === "struck" || phase === "board")){
    ship.warp = null; ship.lines = 0; phase = "escape";
  }
  if (phase === "board") boardStep(dt);
  if (phase === "escape"){
    // you are away once you have left your pursuer astern: the consort if
    // she came, otherwise the prize herself
    const active = consort && !consort.struck && !consort.gone;
    const threat = active ? consort : prize;
    const dT = Math.hypot(threat.x - ship.x, threat.y - ship.y);
    if (dT > (active ? 1300 : 750)) winCard();
  }
  // beaten off: cut up too badly to go on (in the chase, or by her consort)
  if (phase !== "over" && phase !== "board" && ship.damage > 1.5){
    failCard("She has beaten you off",
      "Their guns cut your rigging and hull to pieces. The Spaniards hold their course for Acapulco while you lie licking your wounds.");
  }
}

// -------------------------------------------------------------- loop
wakes.push(makeWakeOf(ship), makeWakeOf(prize));
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, .05); last = now;
  const live = phase === "wait" || phase === "chase" || phase === "struck"
            || phase === "board" || phase === "escape";
  try {
    if (live){
      elapsed += dt;
      CV.weatherStep(env, dt);
      ship.helm = (keys["arrowleft"]?-1:0) + (keys["arrowright"]?1:0);
      const canvasWas = ship.canvas;
      if (keys["arrowup"]) ship.canvas = Math.min(1, ship.canvas + dt*1.3);
      if (keys["arrowdown"]) ship.canvas = Math.max(0, ship.canvas - dt*1.3);
      sailT -= dt;
      if (Math.abs(ship.canvas - canvasWas) > 1e-4 && sailT <= 0){
        sailT = .6; sfxSail(ship.canvas > canvasWas);
      }
      seaLevel();
      sailFillCheck();
      // the odd bird crossing the view, and now and then a cry
      gullWait -= dt;
      if (gullWait <= 0){
        gullWait = 18 + Math.random()*24;      // a flock now and then
        const halfW = (W/2)/T.k, halfH = (H/2)/T.k;
        const dir = Math.random() < .5 ? 1 : -1;
        const sx = cam.x - dir*(halfW + 50);
        const sy = cam.y + (Math.random()-.5)*halfH;
        const vx = dir*(60+Math.random()*30), vy = (Math.random()-.5)*12;
        const n = 4 + (Math.random()*4|0);       // four to seven of them
        for (let k = 0; k < n; k++){
          birds.push({
            x: sx - dir*k*(14+Math.random()*8),                 // strung out behind
            y: sy + (k%2 ? 1 : -1)*Math.ceil(k/2)*(9+Math.random()*5),  // fanned in a V
            vx: vx*(.95+Math.random()*.1), vy: vy + (Math.random()-.5)*4,
            t: 0, cried: false });
        }
        sfxGull();                               // a cry from the flock
      }
      for (const b of birds){
        b.x += b.vx*dt; b.y += b.vy*dt; b.t += dt;
        // a second cry somewhere mid-crossing, occasionally
        if (!b.cried && b.t > 1.5 && Math.random() < dt*.4){ b.cried = true; sfxGull(); }
      }
      birds = birds.filter(b => b.t < 14);
      prizeStep(dt); consortStep(dt);
      for (let i=0;i<7;i++){ step(ship, env, dt); step(prize, env, dt); if (consort) step(consort, env, dt); }
      for (const w of wakes) wakeStep(w, dt);
      combatStep(dt);
      const d = Math.hypot(prize.x-ship.x, prize.y-ship.y);
      if (lastD != null){
        const inst = ((lastD - d) / dt / 7) / KN;
        if (Math.abs(inst) < 40) closure += (inst - closure) * Math.min(1, dt*2);
      }
      lastD = d;
      hazards(dt);
      phasesStep(dt);
    }
  } catch (err) {
    window.__simErr = window.__simErr || [];
    if (window.__simErr.length < 12) window.__simErr.push(String(err));
  }
  camUpdate(dt);

  drawWater();
  drawGlints(env.t);
  drawWakes();
  drawLand(env.t);
  drawRocks(env.t);
  drawSurf(env.t);
  if (consort && !consort.gone) drawShip(ctx, T, consort, env.t, C);
  if (!prize.gone) drawShip(ctx, T, prize, env.t, C);
  if (prize.sink > 0 && !prize.gone) drawSinking(prize);
  drawShip(ctx, T, ship, env.t, C);
  // the grapple lines, and the chest on its way over the rail
  if (phase === "board"){
    ctx.strokeStyle = "rgba(60,42,20,.85)";
    ctx.lineWidth = Math.max(1, T.S(.5));
    for (const f of [-.25, .05, .3]){
      const fx2 = Math.sin(ship.hdg), fy2 = -Math.cos(ship.hdg);
      const px2 = Math.sin(prize.hdg), py2 = -Math.cos(prize.hdg);
      ctx.beginPath();
      ctx.moveTo(T.X(ship.x + fx2*ship.cls.len*f), T.Y(ship.y + fy2*ship.cls.len*f));
      ctx.lineTo(T.X(prize.x + px2*prize.cls.len*f), T.Y(prize.y + py2*prize.cls.len*f));
      ctx.stroke();
    }
    if (chestFly){
      const f = chestFly.f;
      const x = prize.x + (ship.x - prize.x) * f;
      const y = prize.y + (ship.y - prize.y) * f - Math.sin(f * Math.PI) * 4;
      ctx.fillStyle = "#8a5a1e";
      ctx.fillRect(T.X(x) - T.S(1.1), T.Y(y) - T.S(.8), T.S(2.2), T.S(1.6));
      ctx.strokeStyle = "#f2a63c";
      ctx.lineWidth = Math.max(1, T.S(.3));
      ctx.strokeRect(T.X(x) - T.S(1.1), T.Y(y) - T.S(.8), T.S(2.2), T.S(1.6));
    }
  }
  drawShots();
  drawLabels();
  drawBirds(env.t);
  if (phase === "board") drawTreasureInset();
  drawChestPops();
  if (phase !== "brief" && phase !== "over"){ drawSailMark(); drawRose(); drawReloadIcon(); }
  if (damageFlash > 0){
    const a = damageFlash / .55;
    const g2 = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.3, W/2, H/2, Math.max(W,H)*.7);
    g2.addColorStop(0, "rgba(180,30,20,0)");
    g2.addColorStop(1, `rgba(180,30,20,${.5*a})`);
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
  }
  try { hud(); } catch (err) {
    window.__hudErr = window.__hudErr || [];
    if (window.__hudErr.length < 12) window.__hudErr.push(String(err));
  }
  requestAnimationFrame(frame);
}

// dev hooks
window.__dev = {
  get ship(){ return ship; },
  get prize(){ return prize; },
  get consort(){ return consort; },
  get env(){ return env; },
  get phase(){ return phase; },
  set phase(p){ phase = p; },
  put(x, y, hdgDeg, cv2 = 0){
    ship.x = x; ship.y = y; ship.hdg = (hdgDeg||0)*Math.PI/180;
    ship.vx = 0; ship.vy = 0; ship.omega = 0; ship.canvas = cv2;
  },
  wind(fromDeg, kn){ env.windFrom = fromDeg; env.windKn = kn; },
  close(){
    ship.x = prize.x - 150; ship.y = prize.y + 40; ship.hdg = prize.hdg;
    lastD = null; this.snap();
  },
  snap(){ cam.x = ship.x; cam.y = ship.y; },
  fire(){ fire(); },
  castOff(){ if (phase === "board") castOff(); },
  auto: null,
  tick(n = 600){
    const h = 1/60;
    for (let i = 0; i < n; i++){
      elapsed += h;
      CV.weatherStep(env, h);
      prizeStep(h); consortStep(h);
      if (this.auto != null){
        const off = norm(this.auto * Math.PI/180 - ship.hdg);
        ship.helm = Math.max(-1, Math.min(1, off * 2.5));
      }
      for (let k = 0; k < 7; k++){ step(ship, env, h); step(prize, env, h); if (consort) step(consort, env, h); }
      for (const w of wakes) wakeStep(w, h);
      combatStep(h);
      camUpdate(h);
      lastD = Math.hypot(prize.x-ship.x, prize.y-ship.y);
      phasesStep(h);
      if (phase === "over") break;
    }
    return { d: Math.hypot(prize.x-ship.x, prize.y-ship.y),
             shipKn: ship.speedKn, prizeKn: prize.speedKn,
             rig: prize.rigDamage || 0, struck: !!prize.struck, phase,
             cargo: Math.floor(ship.cargo), hold };
  },
};

requestAnimationFrame(frame);
</script>
